name: PhoneDisk routing QA

on:
  push:
    branches: [phone-disk/lan-priority, phone-disk/parallel-downloads]
    paths:
      - "PhoneDisk/**"
      - ".github/workflows/phone-disk-lan-qa.yml"

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout simulator candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify backup history and prepare Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftc -swift-version 5 PhoneDisk/App/BackupHistory.swift PhoneDisk/Tests/verify-backup-history.swift \
            -o "$RUNNER_TEMP/verify-backup-history"
          "$RUNNER_TEMP/verify-backup-history"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd PhoneDisk && xcodegen generate)
      - name: Verify route priority and transfer persistence
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/phone-disk-smoke"
          mkdir -p "$smoke"
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl" req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -subj '/CN=PhoneDisk simulator test root' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$smoke/ca.key" -out "$smoke/ca.crt" 2>/dev/null
          "$openssl" req -new -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' \
            -keyout "$smoke/server.key" -out "$smoke/server.csr" 2>/dev/null
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'extendedKeyUsage=serverAuth' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'subjectAltName=IP:127.0.0.1' > "$smoke/server.ext"
          "$openssl" x509 -req -sha256 -days 2 -in "$smoke/server.csr" -CA "$smoke/ca.crt" -CAkey "$smoke/ca.key" \
            -CAcreateserial -extfile "$smoke/server.ext" -out "$smoke/server.crt"
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl keychain "$device" add-root-cert "$smoke/ca.crt"
          python3 PhoneDisk/Tests/fixture.py "$smoke/upload.txt" "$smoke/server.crt" "$smoke/server.key" &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 8 --retry-connrefused --cacert "$smoke/ca.crt" https://127.0.0.1:18878/ > /dev/null
          xcodebuild test -project PhoneDisk/PhoneDisk.xcodeproj -scheme PhoneDisk \
            -configuration Debug -destination "id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$smoke/build" -only-testing:PhoneDiskRouteTests -only-testing:PhoneDiskUITests/TransferSmoke/testUploadDownloadAndPersistentQueue \
            CODE_SIGNING_ALLOWED=NO
          python3 -c 'from pathlib import Path; import sys; assert Path(sys.argv[1]).read_bytes() == b"PhoneDisk fixture bytes\n"' "$smoke/upload.txt"
      - name: Complete a ten-part download with the iPhone on its Home Screen
        if: github.ref_name == 'phone-disk/parallel-downloads'
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/phone-disk-smoke"
          device="$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')"
          python3 PhoneDisk/Tests/fixture.py "$smoke/upload.txt" "$smoke/server.crt" "$smoke/server.key" --parallel-downloads &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 8 --retry-connrefused --cacert "$smoke/ca.crt" https://127.0.0.1:18878/parallel-state > /dev/null
          xcodebuild test -project PhoneDisk/PhoneDisk.xcodeproj -scheme PhoneDisk \
            -configuration Debug -destination "id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$smoke/build" -only-testing:PhoneDiskUITests/TransferSmoke/testTenRangesFinishWhileOnHomeScreen \
            CODE_SIGNING_ALLOWED=NO
