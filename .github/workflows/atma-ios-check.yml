{
  "name": "ATMA 1 - iPhone + iPad check",
  "run-name": "ATMA check - ${{ inputs.revision }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "revision": {
          "description": "Source branch or exact SHA to check",
          "required": true,
          "type": "string",
          "default": "atma-browser-testflight"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "atma-native-${{ inputs.revision }}",
    "cancel-in-progress": false
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "ios": {
      "name": "Xcode 26.4 - native tests and iPhone/iPad UI",
      "runs-on": "macos-26",
      "timeout-minutes": 30,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.4.app/Contents/Developer",
        "CM_BUILD_DIR": "${{ github.workspace }}",
        "HOMEBREW_NO_AUTO_UPDATE": "1",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "name": "Checkout requested source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.revision }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Use Python 3.12",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Check installed Xcode and runtimes",
          "run": "test -x \"$DEVELOPER_DIR/usr/bin/xcodebuild\"\nxcodebuild -version\nxcrun simctl list runtimes"
        },
        {
          "name": "Validate sources and generate Xcode project",
          "run": "bash release/ci.sh prepare"
        },
        {
          "name": "Reproduce playback and tab-preview regressions",
          "run": "set -euo pipefail\nmkdir -p out\nsdk=\"$(xcrun --sdk iphonesimulator --show-sdk-version)\"\nxcrun simctl list devices available -j | python3 -B release/simulators.py --ios-version \"$sdk\" > out/regression-simulators.json\nsimulator=\"$(python3 -c 'import json; print(json.load(open(\"out/regression-simulators.json\"))[\"iphone\"])')\"\nxcrun simctl boot \"$simulator\" 2>/dev/null || true\nxcrun simctl bootstatus \"$simulator\" -b\ncapture_regression_evidence() {\n  xcrun simctl spawn \"$simulator\" log show --last 5m --style compact --predicate 'process == \"ATMA\" OR process BEGINSWITH \"com.apple.WebKit\"' > out/regression-runtime.log 2>&1 || true\n  xcrun xcresulttool export attachments --path out/ATMA-regressions.xcresult --output-path out/screenshots/regressions || true\n}\ntrap capture_regression_evidence EXIT\nxcodebuild test -project ATMA.xcodeproj -scheme ATMA -configuration Release -destination \"platform=iOS Simulator,id=$simulator\" -derivedDataPath \"$PWD/.cache/derived-simulator\" -resultBundlePath \"$PWD/out/ATMA-regressions.xcresult\" -parallel-testing-enabled NO -only-testing:BrowserNativeTests/BrowserRenderingTests CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES 2>&1 | tee out/regression-test.log\n"
        },
        {
          "name": "Run all iPhone tests and iPad UI smoke",
          "run": "bash release/ci.sh smoke"
        },
        {
          "name": "Save test results, screenshots and verified source SHA",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "atma-native-${{ github.run_id }}",
            "path": "out/*.json\nout/*.log\nout/verified-commit.txt\nout/screenshots/**\nout/ATMA-*.xcresult/**\nout/*-final.png",
            "retention-days": 1,
            "if-no-files-found": "warn",
            "overwrite": true
          }
        }
      ]
    }
  }
}
