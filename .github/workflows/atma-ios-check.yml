{
  "name": "ATMA localized store captures",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "capture": {
      "runs-on": "macos-26",
      "timeout-minutes": 28,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "device": [
            "iphone",
            "ipad"
          ]
        }
      },
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.4.app/Contents/Developer",
        "DEVICE": "${{ matrix.device }}",
        "HOMEBREW_NO_AUTO_UPDATE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "948857860c37a9569775b96c282306eed1e5a025",
            "persist-credentials": false
          }
        },
        {
          "name": "Capture fresh regional desktops",
          "run": "set -euo pipefail\ncommand -v xcodegen >/dev/null || brew install xcodegen\nxcodegen generate\nmkdir -p \"frames/$DEVICE\"\nxcrun simctl list -j devices available | python3 release/simulators.py --ios-version \"$(xcrun --sdk iphonesimulator --show-sdk-version)\" > sim.json\nsim=$(python3 -c 'import json,os; print(json.load(open(\"sim.json\"))[os.environ[\"DEVICE\"]])')\nxcrun simctl boot \"$sim\" || true\nxcrun simctl bootstatus \"$sim\" -b\nxcrun simctl ui \"$sim\" appearance light\nxcrun simctl status_bar \"$sim\" override --time '9:41' --batteryState charged --batteryLevel 100\nxcodebuild build -project ATMA.xcodeproj -scheme ATMA -configuration Release -destination \"platform=iOS Simulator,id=$sim\" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=14 > build.log\nat=dd/Build/Products/Release-iphonesimulator/ATMA.app\nid=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' \"$at/Info.plist\")\nfor pair in ru:RU en:US de:DE fr:FR pt-BR:BR pt-PT:PT ja:JP zh-Hans:CN ko:KR es:ES it:IT; do\n lang=${pair%:*}; reg=${pair#*:}\n xcrun simctl uninstall \"$sim\" \"$id\" 2>/dev/null || true\n xcrun simctl install \"$sim\" \"$at\"\n base=${lang%%-*}\n xcrun simctl launch \"$sim\" \"$id\" -AppleLanguages \"(\\\"$lang\\\")\" -AppleLocale \"${base}_${reg}\"\n sleep 9\n xcrun simctl io \"$sim\" screenshot \"frames/$DEVICE/$reg.png\"\ndone"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "store-home-${{ matrix.device }}",
            "path": "frames/${{ matrix.device }}/*.png",
            "retention-days": 3
          }
        }
      ]
    }
  }
}