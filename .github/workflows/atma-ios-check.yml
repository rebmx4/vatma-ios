{
    "name":  "ATMA screenshot feature sessions",
    "on":  {
               "workflow_dispatch":  {

                                     }
           },
    "permissions":  {
                        "contents":  "read"
                    },
    "jobs":  {
                 "capture":  {
                                 "runs-on":  "macos-26",
                                 "timeout-minutes":  38,
                                 "strategy":  {
                                                  "fail-fast":  false,
                                                  "matrix":  {
                                                                 "device":  [
                                                                                "iphone",
                                                                                "ipad"
                                                                            ],
                                                                 "batch":  [
                                                                               "RU-US-DE-FR",
                                                                               "BR-PT-JP-CN",
                                                                               "KR-ES-IT"
                                                                           ]
                                                             }
                                              },
                                 "env":  {
                                             "DEVELOPER_DIR":  "/Applications/Xcode_26.4.app/Contents/Developer",
                                             "DEVICE":  "${{ matrix.device }}",
                                             "HOMEBREW_NO_AUTO_UPDATE":  "1",
                                             "MARKETS":  "${{ matrix.batch }}"
                                         },
                                 "steps":  [
                                               {
                                                   "uses":  "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
                                                   "with":  {
                                                                "fetch-depth":  0,
                                                                "persist-credentials":  false
                                                            }
                                               },
                                               {
                                                   "name":  "Capture feature panels of the tested release",
                                                   "run":  "set -euo pipefail\ngit diff --quiet 948857860c37a9569775b96c282306eed1e5a025 HEAD -- BrowserUI BrowserNative project.yml\npython3 - \u003c\u003c\u0027PY\u0027\nimport os,pathlib\np=pathlib.Path(\u0027BrowserNativeUITests/StoreFeatureScreenshotsTests.swift\u0027)\nallowed=os.environ[\u0027MARKETS\u0027].split(\u0027-\u0027)\np.write_text(p.read_text().replace(\u0027for market in markets {\u0027,\u0027for market in markets where [\u0027+\u0027, \u0027.join(\u0027\"\u0027+x+\u0027\"\u0027 for x in allowed)+\u0027].contains(market.region) {\u0027))\r\np=pathlib.Path(\u0027BrowserNativeUITests/StoreAdScreenshotsTests.swift\u0027)\r\np.write_text(p.read_text().replace(\u0027for market in markets {\u0027,\u0027for market in markets where [\u0027+\u0027, \u0027.join(\u0027\"\u0027+x+\u0027\"\u0027 for x in allowed)+\u0027].contains(market.region) {\u0027))\nPY\ncommand -v xcodegen \u003e/dev/null || brew install xcodegen\nxcodegen generate\nxcrun simctl list -j devices available | python3 release/simulators.py --ios-version \"$(xcrun --sdk iphonesimulator --show-sdk-version)\" \u003e sim.json\nsim=$(python3 -c \u0027import json,os; print(json.load(open(\"sim.json\"))[os.environ[\"DEVICE\"]])\u0027)\nxcrun simctl boot \"$sim\" || true\nxcrun simctl bootstatus \"$sim\" -b\nxcrun simctl ui \"$sim\" appearance light\nxcrun simctl status_bar \"$sim\" override --time 9:41 --batteryState charged --batteryLevel 100\nxcodebuild test -project ATMA.xcodeproj -scheme ATMA -configuration Release -destination \"platform=iOS Simulator,id=$sim\" -only-testing:BrowserNativeUITests/StoreFeatureScreenshotsTests -only-testing:BrowserNativeUITests/StoreAdScreenshotsTests -parallel-testing-enabled NO -maximum-test-execution-time-allowance 1500 -resultBundlePath evidence.xcresult CURRENT_PROJECT_VERSION=14 ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO \u003e report.txt || { tail -60 report.txt; exit 1; }"
                                               },
                                               {
                                                   "name":  "Export feature frames",
                                                   "if":  "always()",
                                                   "run":  "mkdir -p frames\nif [ -d evidence.xcresult ]; then\n xcrun xcresulttool export attachments --path evidence.xcresult --output-path raw\n python3 - \u003c\u003c\u0027PY\u0027\nfrom pathlib import Path\nimport json, shutil\nd=Path(\u0027raw\u0027)\nfor test in json.loads((d/\u0027manifest.json\u0027).read_text()):\n for a in test[\u0027attachments\u0027]:\n  name=a.get(\u0027suggestedHumanReadableName\u0027,\u0027\u0027)\n  if name.startswith(\u0027native-14-\u0027) and name.endswith(\u0027.png\u0027):\n   shutil.copyfile(d/a[\u0027exportedFileName\u0027],Path(\u0027frames\u0027)/(name.split(\u0027_\u0027)[0]+\u0027.png\u0027))\nPY\nfi"
                                               },
                                               {
                                                   "uses":  "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
                                                   "with":  {
                                                                "name":  "store-features-${{ matrix.device }}-${{ matrix.batch }}",
                                                                "path":  "frames/*.png",
                                                                "retention-days":  3
                                                            },
                                                   "if":  "always()"
                                               }
                                           ]
                             }
             }
}