{
    "name":  "ATMA 1 - iPhone + iPad check",
    "run-name":  "ATMA 12 localized store gallery",
    "on":  {
               "workflow_dispatch":  {
                                         "inputs":  {
                                                        "revision":  {
                                                                         "description":  "Source branch or exact SHA to check",
                                                                         "required":  true,
                                                                         "type":  "string",
                                                                         "default":  "atma-browser-testflight"
                                                                     }
                                                    }
                                     }
           },
    "permissions":  {
                        "contents":  "read"
                    },
    "concurrency":  {
                        "group":  "atma-12-localized-captures",
                        "cancel-in-progress":  false
                    },
    "defaults":  {
                     "run":  {
                                 "shell":  "bash"
                             }
                 },
    "jobs":  {
                 "ios":  {
                             "name":  "Native App Store capture · ${{ matrix.device }}",
                             "runs-on":  "macos-26",
                             "timeout-minutes":  40,
                             "env":  {
                                         "DEVELOPER_DIR":  "/Applications/Xcode_26.4.app/Contents/Developer",
                                         "CM_BUILD_DIR":  "${{ github.workspace }}",
                                         "HOMEBREW_NO_AUTO_UPDATE":  "1",
                                         "PYTHONDONTWRITEBYTECODE":  "1"
                                     },
                             "steps":  [
                                           {
                                               "name":  "Checkout requested source",
                                               "uses":  "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
                                               "with":  {
                                                            "ref":  "${{ inputs.revision }}",
                                                            "persist-credentials":  false
                                                        }
                                           },
                                           {
                                               "name":  "Use Python 3.12",
                                               "uses":  "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
                                               "with":  {
                                                            "python-version":  "3.12"
                                                        }
                                           },
                                           {
                                               "name":  "Check installed Xcode and runtimes",
                                               "run":  "test -x \"$DEVELOPER_DIR/usr/bin/xcodebuild\"\nxcodebuild -version\nxcrun simctl list runtimes"
                                           },
                                           {
                                               "name":  "Validate sources and generate Xcode project",
                                               "run":  "bash release/ci.sh prepare"
                                           },
                                           {
                                               "name":  "Capture the real ATMA screens",
                                               "run":  "set -euo pipefail\nsdk=\"$(xcrun --sdk iphonesimulator --show-sdk-version)\"\nxcrun simctl list devices available -j | python3 -B release/simulators.py --ios-version \"$sdk\" \u003e out/simulators.json\nsimulator=\"$(python3 -c \u0027import json,sys; print(json.load(open(\"out/simulators.json\"))[sys.argv[1]])\u0027 \"$DEVICE\")\"\nxcrun simctl boot \"$simulator\" 2\u003e/dev/null || true\nxcrun simctl bootstatus \"$simulator\" -b\nxcrun simctl status_bar \"$simulator\" override --time \"9:41\" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState unplugged --batteryLevel 100\nresult=\"out/ATMA-$DEVICE.xcresult\"\nset +e\nxcodebuild test -project ATMA.xcodeproj -scheme ATMA -configuration Release \\\n  -destination \"platform=iOS Simulator,id=$simulator\" -derivedDataPath .cache/derived-simulator \\\n  -resultBundlePath \"$result\" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES \\\n  -only-testing:BrowserNativeTests/StoreGalleryCaptureTests 2\u003e\u00261 | tee \"out/gallery-$DEVICE.log\"\nstatus=\"${PIPESTATUS[0]}\"\nset -e\nif [[ -d \"$result\" ]]; then\n  xcrun xcresulttool export attachments --path \"$result\" --output-path out/gallery\nfi\nexit \"$status\"",
                                               "env":  {
                                                           "DEVICE":  "${{ matrix.device }}"
                                                       }
                                           },
                                           {
                                               "name":  "Save test results, screenshots and verified source SHA",
                                               "if":  "${{ always() }}",
                                               "uses":  "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
                                               "with":  {
                                                            "name":  "atma-gallery-${{ matrix.device }}",
                                                            "path":  "out/gallery/**\nout/gallery-*.log\nout/simulators.json",
                                                            "retention-days":  1,
                                                            "if-no-files-found":  "warn",
                                                            "overwrite":  true
                                                        }
                                           }
                                       ],
                             "strategy":  {
                                              "fail-fast":  false,
                                              "matrix":  {
                                                             "device":  [
                                                                            "iphone",
                                                                            "ipad"
                                                                        ]
                                                         }
                                          }
                         }
             }
}