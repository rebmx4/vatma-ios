{
  "name": "Мой диск — iPhone and TestFlight",
  "on": {
    "push": {
      "branches": [
        "phone-disk/testflight"
      ],
      "paths": [
        "PhoneDisk/**",
        ".github/workflows/phone-disk.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "compile": {
      "runs-on": "macos-26",
      "timeout-minutes": 12,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.4.app/Contents/Developer",
        "HOMEBREW_NO_AUTO_UPDATE": "1"
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Generate iPhone project",
          "run": "brew list xcodegen >/dev/null 2>&1 || brew install xcodegen\ncd PhoneDisk\nxcodegen generate"
        },
        {
          "name": "Compile against the iPhone simulator SDK",
          "run": "set -euo pipefail\nxcodebuild -project PhoneDisk/PhoneDisk.xcodeproj -scheme PhoneDisk -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath \"$RUNNER_TEMP/phonedisk-build\" CODE_SIGNING_ALLOWED=NO build\n"
        }
      ]
    },
    "transfers": {
      "runs-on": "macos-26",
      "timeout-minutes": 24,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.4.app/Contents/Developer",
        "HOMEBREW_NO_AUTO_UPDATE": "1"
      },
      "needs": "compile",
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Generate iPhone project",
          "run": "brew list xcodegen >/dev/null 2>&1 || brew install xcodegen\ncd PhoneDisk\nxcodegen generate"
        },
        {
          "name": "Verify transfers and persistent queue with synthetic data",
          "run": "set -euo pipefail\ntls=\"$RUNNER_TEMP/phone-disk-tls\"\nmkdir -p \"$tls\"\nopenssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=PhoneDisk-Tests -addext 'basicConstraints=critical,CA:TRUE' -keyout \"$tls/root.key\" -out \"$tls/root.pem\"\nopenssl req -new -newkey rsa:2048 -nodes -subj /CN=127.0.0.1 -keyout \"$tls/server.key\" -out \"$tls/server.csr\"\nprintf '%s\\n' 'subjectAltName=IP:127.0.0.1' 'extendedKeyUsage=serverAuth' 'basicConstraints=critical,CA:FALSE' > \"$tls/server.ext\"\nopenssl x509 -req -in \"$tls/server.csr\" -CA \"$tls/root.pem\" -CAkey \"$tls/root.key\" -CAcreateserial -days 1 -extfile \"$tls/server.ext\" -out \"$tls/server.pem\"\npython3 PhoneDisk/Tests/fixture.py \"$RUNNER_TEMP/phone-disk-result.txt\" \"$tls/server.pem\" \"$tls/server.key\" &\nfixture=$!\ntrap 'kill \"$fixture\" 2>/dev/null || true' EXIT\ndevice=\"$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(x[\"udid\"] for v in json.load(sys.stdin)[\"devices\"].values() for x in v if x[\"name\"].startswith(\"iPhone\")))')\"\nxcrun simctl boot \"$device\" || true\nxcrun simctl bootstatus \"$device\" -b\nxcrun simctl keychain \"$device\" add-root-cert \"$tls/root.pem\"\ndiagnose() {\n  dir=\"$(xcrun simctl get_app_container \"$device\" ru.atma.phonedisk data 2>/dev/null)\" || return 0\n  python3 -c 'import json,sys; print([(j[\"name\"],j[\"phase\"],j[\"progress\"]) for j in json.load(open(sys.argv[1]))])' \"$dir/Library/Application Support/PhoneDisk/queue.json\" || true\n}\ntrap 'diagnose; kill \"$fixture\" 2>/dev/null || true' EXIT\nxcodebuild test -project PhoneDisk/PhoneDisk.xcodeproj -scheme PhoneDisk -configuration Debug -destination \"id=$device\" -parallel-testing-enabled NO -derivedDataPath \"$RUNNER_TEMP/phonedisk-build\" CODE_SIGNING_ALLOWED=NO\npython3 -c 'import pathlib,sys; assert pathlib.Path(sys.argv[1]).read_bytes() == b\"PhoneDisk fixture bytes\\n\"' \"$RUNNER_TEMP/phone-disk-result.txt\"\n"
        }
      ]
    },
    "testflight": {
      "runs-on": "macos-26",
      "timeout-minutes": 24,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.4.app/Contents/Developer",
        "HOMEBREW_NO_AUTO_UPDATE": "1"
      },
      "needs": "compile",
      "if": "contains(github.event.head_commit.message, '[testflight]')",
      "concurrency": {
        "group": "phonedisk-release",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Generate iPhone project",
          "run": "brew list xcodegen >/dev/null 2>&1 || brew install xcodegen\ncd PhoneDisk\nxcodegen generate"
        },
        {
          "name": "Set up signing tools",
          "run": "python3 -m venv \"$RUNNER_TEMP/phonedisk-python\"\n\"$RUNNER_TEMP/phonedisk-python/bin/pip\" install codemagic-cli-tools\necho \"$RUNNER_TEMP/phonedisk-python/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Sign, archive and upload the separate app",
          "env": {
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
            "CERT_KEY_B64": "${{ secrets.CERT_KEY_B64 }}"
          },
          "run": "set -euo pipefail\ntest -n \"$APP_STORE_CONNECT_ISSUER_ID\" && test -n \"$APP_STORE_CONNECT_KEY_IDENTIFIER\" && test -n \"$APP_STORE_CONNECT_PRIVATE_KEY\" && test -n \"$CERT_KEY_B64\"\nkeychain initialize\nexport CERTIFICATE_PRIVATE_KEY\nCERTIFICATE_PRIVATE_KEY=\"$(printf '%s' \"$CERT_KEY_B64\" | base64 --decode)\"\napp-store-connect fetch-signing-files ru.atma.phonedisk --type IOS_APP_STORE --create\nkeychain add-certificates\nxcode-project use-profiles --project PhoneDisk/PhoneDisk.xcodeproj --export-options-plist \"$RUNNER_TEMP/phonedisk-export.plist\"\nnumber=\"$((GITHUB_RUN_NUMBER*10+GITHUB_RUN_ATTEMPT))\"\nxcodebuild archive -project PhoneDisk/PhoneDisk.xcodeproj -scheme PhoneDisk -configuration Release -destination 'generic/platform=iOS' -archivePath \"$RUNNER_TEMP/PhoneDisk.xcarchive\" CURRENT_PROJECT_VERSION=\"$number\"\ncodesign --verify --deep --strict \"$RUNNER_TEMP/PhoneDisk.xcarchive/Products/Applications/PhoneDisk.app\"\napp=\"$RUNNER_TEMP/PhoneDisk.xcarchive/Products/Applications/PhoneDisk.app\"\nicon=\"$(find \"$app\" -maxdepth 1 -name 'AppIcon60x60@*.png' -print -quit)\"\ntest -n \"$icon\"\nswift PhoneDisk/Tests/check-icon.swift \"$icon\"\nxcodebuild -exportArchive -archivePath \"$RUNNER_TEMP/PhoneDisk.xcarchive\" -exportPath \"$RUNNER_TEMP/phonedisk-ipa\" -exportOptionsPlist \"$RUNNER_TEMP/phonedisk-export.plist\"\napp-store-connect publish --path \"$RUNNER_TEMP/phonedisk-ipa/PhoneDisk.ipa\" --enable-package-validation\necho \"Uploaded 1.0.0 ($number)\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ]
    }
  }
}
