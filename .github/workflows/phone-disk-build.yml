name: PhoneDisk build only

on:
  push:
    branches: [phone-disk/transfers-v2]
    paths:
      - "PhoneDisk/App/**"
      - "PhoneDisk/Info.plist"
      - ".github/workflows/phone-disk-build.yml"
      - ".github/phone-disk-build-recipient.pem"

permissions:
  contents: read

concurrency:
  group: phone-disk-build-only
  cancel-in-progress: true

jobs:
  archive:
    if: contains(github.event.head_commit.message, '[phone-disk-build-only]')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      DISK_APP_ID: "6838673473"
      DISK_BUNDLE: ru.atma.phonedisk
      DISK_TEAM: GR3WB4Z646
      DISK_VERSION: "1.0.0"
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify backup history and prepare Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftc -swift-version 5 PhoneDisk/App/BackupHistory.swift PhoneDisk/Tests/verify-backup-history.swift \
            -o "$RUNNER_TEMP/verify-backup-history"
          "$RUNNER_TEMP/verify-backup-history"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd PhoneDisk && xcodegen generate)
          tools="$RUNNER_TEMP/phone-disk-build-tools"
          python3 -m venv "$tools"
          "$tools/bin/pip" install --disable-pip-version-check codemagic-cli-tools==0.70.0
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Prepare existing signing materials
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT_KEY_B64: ${{ secrets.CERT_KEY_B64 }}
        run: |
          set -euo pipefail
          latest="$(app-store-connect get-latest-testflight-build-number "$DISK_APP_ID")"
          [[ "$latest" =~ ^[0-9]+$ ]]
          echo "DISK_BUILD=$((latest + 1))" >> "$GITHUB_ENV"
          keychain initialize
          export CERTIFICATE_PRIVATE_KEY
          CERTIFICATE_PRIVATE_KEY="$(printf '%s' "$CERT_KEY_B64" | base64 --decode)"
          app-store-connect fetch-signing-files "$DISK_BUNDLE" --type IOS_APP_STORE
          keychain add-certificates
          options="$RUNNER_TEMP/phone-disk-export.plist"
          xcode-project use-profiles --project PhoneDisk/PhoneDisk.xcodeproj --export-options-plist "$options"
          /usr/libexec/PlistBuddy -c 'Delete :destination' "$options" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$options"
      - name: Archive and verify one iOS build
        run: |
          set -euo pipefail
          project=PhoneDisk/PhoneDisk.xcodeproj
          archive="$RUNNER_TEMP/PhoneDisk.xcarchive"
          xcodebuild archive -project "$project" -scheme PhoneDisk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CURRENT_PROJECT_VERSION="$DISK_BUILD" MARKETING_VERSION="$DISK_VERSION"
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$RUNNER_TEMP/phone-disk-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/phone-disk-export.plist"
          ipa="$RUNNER_TEMP/phone-disk-ipa/PhoneDisk.ipa"
          unpacked="$RUNNER_TEMP/phone-disk-verified"
          ditto -x -k "$ipa" "$unpacked"
          app="$unpacked/Payload/PhoneDisk.app"
          codesign --verify --deep --strict "$app"
          entitlements="$RUNNER_TEMP/phone-disk-entitlements.plist"
          codesign -d --entitlements :- "$app" > "$entitlements"
          python3 - "$app/Info.plist" "$entitlements" <<'PY'
          import os
          import plistlib
          import sys

          def plist(path):
              with open(path, "rb") as stream:
                  return plistlib.load(stream)

          info, entitlements = map(plist, sys.argv[1:])
          bundle = os.environ["DISK_BUNDLE"]
          assert info["CFBundleIdentifier"] == bundle
          assert info["CFBundleShortVersionString"] == os.environ["DISK_VERSION"]
          assert info["CFBundleVersion"] == os.environ["DISK_BUILD"]
          assert sorted(info["UIDeviceFamily"]) == [1, 2]
          assert info["BGTaskSchedulerPermittedIdentifiers"] == [bundle + ".scan"]
          assert info["NSBonjourServices"] == ["_phonedisk._tcp"]
          assert entitlements["application-identifier"] == os.environ["DISK_TEAM"] + "." + bundle
          assert not entitlements.get("get-task-allow", False)
          PY
          icon="$(find "$app" -maxdepth 1 -name 'AppIcon60x60@*.png' -print -quit)"
          test -n "$icon"
          swift PhoneDisk/Tests/check-icon.swift "$icon"
      - name: Encrypt the signed IPA for the requesting PC
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phone-disk-delivery"
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$openssl"
          ipa="$RUNNER_TEMP/phone-disk-ipa/PhoneDisk.ipa"
          "$openssl" cms -encrypt -binary -aes-256-gcm -in "$ipa" -outform DER \
            -recip .github/phone-disk-build-recipient.pem \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 \
            -out "$RUNNER_TEMP/phone-disk-delivery/PhoneDisk.ipa.cms"
          shasum -a 256 "$ipa" | awk '{ print $1 }' > "$RUNNER_TEMP/phone-disk-delivery/sha256.txt"
          printf '%s\n%s\n%s\n' "$DISK_VERSION" "$DISK_BUILD" "$GITHUB_SHA" > "$RUNNER_TEMP/phone-disk-delivery/build.txt"
          echo "Verified and exported PhoneDisk $DISK_VERSION ($DISK_BUILD)." >> "$GITHUB_STEP_SUMMARY"
      - name: Save encrypted build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phonedisk-encrypted-ipa-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-disk-delivery
          retention-days: 2
          if-no-files-found: error
