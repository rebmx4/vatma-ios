name: PhoneDisk 63 TestFlight upload

on:
  push:
    branches: [phone-disk/transfers-v2]
    paths: [".github/workflows/phone-disk-upload-63.yml"]

permissions:
  actions: read
  contents: read

concurrency:
  group: phone-disk-testflight-6838673473
  cancel-in-progress: false

jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[phone-disk-upload-63]')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      DISK_APP_ID: "6838673473"
      DISK_VERSION: "1.0.0"
      DISK_BUILD: "63"
      IPA_SHA256: "770740797e1a20b7170d529315f7eced63b5e23778121f006e0698dd60722c5b"
    steps:
      - name: Checkout delivery authorization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the signed build from its original run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: phonedisk-encrypted-ipa-45548202840
          run-id: "45548202840"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/phone-disk-original
      - name: Decrypt and verify the exact IPA
        env:
          PHONE_DISK_UPLOAD63_KEY: ${{ secrets.PHONEDISK_UPLOAD63_C63C348B_KEY }}
        run: |
          set -euo pipefail
          test -n "$PHONE_DISK_UPLOAD63_KEY"
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s' "$PHONE_DISK_UPLOAD63_KEY" | base64 --decode > "$key"
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          ipa="$RUNNER_TEMP/PhoneDisk-1.0.0-63.ipa"
          "$openssl" cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/phone-disk-original/PhoneDisk.ipa.cms" \
            -recip .github/phone-disk-build-recipient.pem -inkey "$key" -out "$ipa"
          printf '%s  %s\n' "$IPA_SHA256" "$ipa" | shasum -a 256 --check
          python3 - "$ipa" <<'PY'
          import os
          import plistlib
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None
              info = plistlib.loads(archive.read("Payload/PhoneDisk.app/Info.plist"))
              assert info["CFBundleIdentifier"] == "ru.atma.phonedisk"
              assert info["CFBundleShortVersionString"] == os.environ["DISK_VERSION"]
              assert info["CFBundleVersion"] == os.environ["DISK_BUILD"]
          PY
      - name: Prepare uploader and build-status check
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/phone-disk-upload-tools"
          python3 -m venv "$tools"
          "$tools/bin/pip" install --disable-pip-version-check codemagic-cli-tools==0.70.0
          echo "$tools/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/phone-disk-read-state.py" <<'PY'
          import json
          import os
          import sys
          result = json.load(sys.stdin)
          if isinstance(result, dict):
              result = result.get("data", [result])
          if not isinstance(result, list):
              raise ValueError("Unexpected App Store Connect build response")
          builds = [build for build in result if build.get("attributes", build).get("version") == os.environ["DISK_BUILD"]]
          if len(builds) > 1:
              raise ValueError("More than one build matched the delivery")
          if not builds:
              print("MISSING")
          else:
              attributes = builds[0].get("attributes", builds[0])
              print(attributes["processingState"])
          PY
      - name: Upload build 63 to App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          existing="$(app-store-connect apps builds "$DISK_APP_ID" --platform IOS \
            --pre-release-version "$DISK_VERSION" --build-version-number "$DISK_BUILD" --json \
            | python3 "$RUNNER_TEMP/phone-disk-read-state.py")"
          case "$existing" in
            MISSING) app-store-connect publish --path "$RUNNER_TEMP/PhoneDisk-1.0.0-63.ipa" --enable-package-validation ;;
            PROCESSING|VALID) echo "Build 63 is already in App Store Connect ($existing)." ;;
            *) echo "Build 63 already exists with state $existing."; exit 1 ;;
          esac
          echo "App Store Connect has received PhoneDisk 1.0.0 (63)." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Apple processing and TestFlight visibility
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for check in $(seq 1 24); do
            if state="$(app-store-connect apps builds "$DISK_APP_ID" --platform IOS \
              --pre-release-version "$DISK_VERSION" --build-version-number "$DISK_BUILD" --json \
              | python3 "$RUNNER_TEMP/phone-disk-read-state.py")"; then
              echo "App Store Connect state for 1.0.0 (63): $state"
              case "$state" in
                VALID) echo "Apple processing complete. PhoneDisk 1.0.0 (63) is visible in TestFlight." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
                FAILED|INVALID) exit 1 ;;
              esac
            fi
            if [ "$check" -lt 24 ]; then sleep 45; fi
          done
          echo "Apple has received the IPA. Build processing is still pending." >> "$GITHUB_STEP_SUMMARY"
          exit 1
