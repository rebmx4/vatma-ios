{
  "name": "ATMA public release preparation",
  "run-name": "Replace ATMA promotional cards and submit for App Review",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "sha256": {
          "description": "SHA-256 of the validated screenshot package",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Download approved campaign archive",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "PACKAGE_SHA256": "${{ inputs.sha256 }}"
          },
          "run": "set -eu\ngh api repos/rebmx4/vatma-ios/releases/460816817 > release.json\njq -e '.draft == true and .tag_name == \"atma-14-ad-filter-media-20261127\"' release.json > /dev/null\nasset=$(jq -er '.assets[]|select(.state==\"uploaded\" and .name==\"atma-14-ad-filter.zip\")|.id' release.json)\ngh api -H \"Accept: application/octet-stream\" \"repos/rebmx4/vatma-ios/releases/assets/$asset\" > gallery.zip\nprintf '%s  gallery.zip\\n' \"$PACKAGE_SHA256\" | sha256sum -c -\nmkdir package\nunzip -q gallery.zip -d package"
        },
        {
          "name": "Update the first screenshot and submit the verified build",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n\n\n\nconst fs=require('node:fs'), {createHash}=require('node:crypto');\nconst version='f2709e75-dbf7-450c-8d5e-634d8c310339', build='15f23a91-8e42-42fa-b598-2b06967b42f1';\nconst previousSubmission='4e262179-8945-4937-b113-2e6609cbd638';\nconst baseline=JSON.parse(fs.readFileSync('package/original.json','utf8'));\nconst replacements=JSON.parse(fs.readFileSync('package/replacements.json','utf8'));\n\nconst bag=(type,id)=>({type,id});\nconst pause=ms=>new Promise(ok=>setTimeout(ok,ms));\nconst say=(...a)=>console.log('STORE14',...a);\nasync function order(setId,ids) {\n const r=await fetch('https://api.appstoreconnect.apple.com/v1/appScreenshotSets/'+setId+'/relationships/appScreenshots',{method:'PATCH',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:JSON.stringify({data:ids.map(id=>bag('appScreenshots',id))})});\n if(!r.ok){const j=await r.json();throw Error('order '+r.status+' '+j.errors?.[0]?.detail);}\n}\nasync function assets(id){return req('/appScreenshotSets/'+id+'/appScreenshots?limit=50');}\nasync function sets(id){return req('/appStoreVersionLocalizations/'+id+'/appScreenshotSets?limit=50');}\nasync function uploadOne(set,row,previous) {\n const bytes=fs.readFileSync('package/'+row.path);\n if(bytes.length!==row.size || createHash('md5').update(bytes).digest('hex')!==row.md5)throw Error('File validation '+row.name);\n let item=previous.find(x=>x.attributes.fileName===row.name);\n if(item && item.attributes.assetDeliveryState?.state==='FAILED'){\n  await req('/appScreenshots/'+item.id,'DELETE'); item=null;\n }\n if(!item)item=await req('/appScreenshots','POST',{type:'appScreenshots',attributes:{fileName:row.name,fileSize:row.size},relationships:{appScreenshotSet:{data:bag('appScreenshotSets',set.id)}}});\n const attr=item.attributes;\n if(attr.assetDeliveryState?.state==='COMPLETE'||attr.assetDeliveryState?.state==='UPLOAD_COMPLETE'){\n  if(attr.sourceFileChecksum && attr.sourceFileChecksum.toLowerCase()!==row.md5)throw Error('Checksum mismatch '+row.name);\n  return item.id;\n }\n let ops=attr.uploadOperations;\n if(!ops?.length){const ref=await req('/appScreenshots/'+item.id);ops=ref.attributes.uploadOperations;}\n if(!ops?.length)throw Error('Missing upload plan '+row.name);\n for(const op of ops) {\n  const url=new URL(op.url);\n  if(url.protocol!=='https:')throw Error('Non-HTTPS transfer');\n  const headers=Object.fromEntries((op.requestHeaders||[]).map(h=>[h.name,h.value]));\n  let success=false,code=0;\n  for(let attempt=0;attempt<4;attempt++){\n   try {const r=await fetch(url,{method:op.method,headers,body:bytes.subarray(op.offset,op.offset+op.length),redirect:'error',signal:AbortSignal.timeout(90000)});code=r.status;await r.arrayBuffer();if(r.ok){success=true;break;}}catch{code=0}\n   await pause(800*(attempt+1));\n  }\n  if(!success)throw Error('Transfer failed '+row.name+' HTTP '+code);\n }\n await req('/appScreenshots/'+item.id,'PATCH',{...bag('appScreenshots',item.id),attributes:{uploaded:true,sourceFileChecksum:row.md5}});\n return item.id;\n}\n\n\nfunction matches(asset,row) {\n return asset && asset.attributes.fileName===row.name && asset.attributes.sourceFileChecksum?.toLowerCase()===row.md5 && asset.attributes.assetDeliveryState?.state==='COMPLETE';\n}\nasync function verify(job){\n const screenshots=await assets(job.set.id);\n if(screenshots.length!==job.expected.length||screenshots.some((s,i)=>!matches(s,job.expected[i])))throw Error('Set verification failed '+job.key);\n}\nconst ref=(type,id)=>({data:bag(type,id)});\nasync function submit(){\n const submissions=await req('/apps/'+app+'/reviewSubmissions?filter[platform]=IOS&include=appStoreVersionForReview&limit=100');\n let draft=null;\n for(const s of submissions.filter(s=>s.attributes.state==='READY_FOR_REVIEW')){\n  const items=await req('/reviewSubmissions/'+s.id+'/items?include=appStoreVersion&limit=50');\n  if(!items.length){draft=draft||{s,has:false};continue;}\n  if(items.length===1&&items[0].relationships?.appStoreVersion?.data?.id===version){draft={s,has:true};break;}\n }\n if(!draft)draft={s:await req('/reviewSubmissions','POST',{type:'reviewSubmissions',attributes:{platform:'IOS'},relationships:{app:ref('apps',app)}}),has:false};\n const id=draft.s.id;\n if(id===previousSubmission)throw Error('Previously canceled submission reused');\n if(!draft.has)await req('/reviewSubmissionItems','POST',{type:'reviewSubmissionItems',relationships:{reviewSubmission:ref('reviewSubmissions',id),appStoreVersion:ref('appStoreVersions',version)}});\n const items=await req('/reviewSubmissions/'+id+'/items?include=appStoreVersion');\n if(items.length!==1||items[0].relationships?.appStoreVersion?.data?.id!==version)throw Error('Wrong submission contents');\n await req('/reviewSubmissions/'+id,'PATCH',{...bag('reviewSubmissions',id),attributes:{submitted:true}});\n for(let i=0;i<10;i++){\n  const s=await req('/reviewSubmissions/'+id),v=await req('/appStoreVersions/'+version);\n  if(['WAITING_FOR_REVIEW','IN_REVIEW','COMPLETING','COMPLETE'].includes(s.attributes.state)){\n   say('APPLE',id,s.attributes.state,v.attributes.appStoreState,v.attributes.releaseType,s.attributes.submittedDate);return;\n  }await pause(4000);\n }\n throw Error('Submission state did not confirm');\n}\n(async()=>{\n const v=await req('/appStoreVersions/'+version),b=await req('/appStoreVersions/'+version+'/build');\n if(v.attributes.versionString!=='1.0.1'||b.id!==build||b.attributes.version!=='14'||v.attributes.releaseType!=='AFTER_APPROVAL')throw Error('Release settings mismatch');\n if(!['PREPARE_FOR_SUBMISSION','DEVELOPER_REJECTED','READY_FOR_REVIEW'].includes(v.attributes.appStoreState))throw Error('Expected an editable version. Current state '+v.attributes.appStoreState);\n if(replacements.length!==22||baseline.length!==110||new Set(replacements.map(r=>r.path)).size!==22)throw Error('Invalid package size');\n const review=await req('/appStoreVersions/'+version+'/appStoreReviewDetail');\n if(!review.attributes.notes?.includes('scoped advertising adapters for YouTube, Rutube and VK'))throw Error('Reviewer notes must describe platform-specific ad filtering');\n const locales=await req('/appStoreVersions/'+version+'/appStoreVersionLocalizations?limit=50'),jobs=[];\n for(const l of locales){\n  const loc=l.attributes.locale;\n  if(!replacements.some(r=>r.loc===loc))continue;\n  const available=await sets(l.id);\n  for(const [device,fmt] of [['iphone','APP_IPHONE_67'],['ipad','APP_IPAD_PRO_3GEN_129']]){\n   const set=available.find(s=>s.attributes.screenshotDisplayType===fmt);\n   if(!set)throw Error('Missing set '+loc+' '+device);\n   const old=baseline.filter(r=>r.loc===loc&&r.device===device).sort((a,b)=>a.order-b.order);\n   const repl=replacements.find(r=>r.loc===loc&&r.device===device);\n   if(old.length!==5||!repl)throw Error('Missing files for set '+loc+' '+device);\n   const current=await assets(set.id),rest=old.slice(1).map(row=>current.find(s=>matches(s,row)));\n   if(rest.some(s=>!s)||current.some(s=>![old[0].name,repl.name,...rest.map(f=>f.attributes.fileName)].includes(s.attributes.fileName)))throw Error('Unexpected media in '+loc+' '+device);\n   const previousFirst=current.find(s=>matches(s,old[0]));\n   const existingNew=current.find(s=>matches(s,repl));\n   if(!previousFirst&&!existingNew)throw Error('No matching first screenshot '+loc+' '+device);\n   jobs.push({key:loc+' '+device,set,current,previousFirst,rest,repl,expected:[repl,...old.slice(1)]});\n  }\n }\n if(jobs.length!==22)throw Error('Expected 22 locale/device sets');\n const live=(await req('/apps/'+app+'/appStoreVersions?filter[platform]=IOS&limit=25')).find(x=>x.attributes.versionString==='1.0.0');\n if(!live)throw Error('Missing public predecessor');\n const publicSets=new Set();\n for(const l of await req('/appStoreVersions/'+live.id+'/appStoreVersionLocalizations?limit=50'))for(const s of await sets(l.id))publicSets.add(s.id);\n if(jobs.some(job=>publicSets.has(job.set.id)))throw Error('A set is shared with the published version');\n let next=0;\n await Promise.all(Array.from({length:4},async()=>{while(next<jobs.length){\n  const job=jobs[next++];\n  job.newId=await uploadOne(job.set,job.repl,job.current);\n  say('UPLOADED',job.key);\n }}));\n for(let attempt=0;attempt<20;attempt++){\n  let pending=0;\n  for(const job of jobs){\n   const shot=(await assets(job.set.id)).find(s=>s.id===job.newId);\n   if(shot?.attributes.assetDeliveryState?.state==='FAILED')throw Error('Processing failed '+job.key+' '+JSON.stringify(shot.attributes.assetDeliveryState.errors));\n   if(!matches(shot,job.repl))pending++;\n  }\n  if(!pending)break;\n  if(attempt===19)throw Error('Still processing '+pending);\n  await pause(4000);\n }\n for(const job of jobs){\n  const desired=[job.newId,...job.rest.map(s=>s.id)];\n  let links=await req('/appScreenshotSets/'+job.set.id+'/relationships/appScreenshots?limit=20');\n  if(links.map(s=>s.id).slice(0,5).join()!==desired.join())await order(job.set.id,job.previousFirst?[...desired,job.previousFirst.id]:desired);\n  if(job.previousFirst){\n   links=await req('/appScreenshotSets/'+job.set.id+'/relationships/appScreenshots?limit=20');\n   if(links.map(s=>s.id).slice(0,5).join()!==desired.join())throw Error('New first image order was not confirmed '+job.key);\n   if(links.some(s=>s.id===job.previousFirst.id))await req('/appScreenshots/'+job.previousFirst.id,'DELETE');\n  }\n  await verify(job);\n }\n say('VERIFIED',22,'replacements and',88,'retained screenshots');\n await submit();\n})().catch(error=>{console.error('STORE14 ISSUE',error.message);process.exitCode=1});\nNODE"
        }
      ],
      "permissions": {
        "contents": "write"
      }
    }
  }
}