{
  "name": "ATMA public release preparation",
  "run-name": "Inspect ATMA App Store draft",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "ATMA App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n(async()=>{\n const versions=await req('/apps/'+app+'/appStoreVersions?limit=30');\n const infos=await req('/apps/'+app+'/appInfos?limit=30');\n const show=(k,x)=>console.log('STORE14 '+k+' '+JSON.stringify(x));\n show('versions',versions.map(x=>[x.id,x.attributes.versionString,x.attributes.appStoreState,x.attributes.releaseType,Boolean(x.attributes.copyright)]));\n for (const i of infos){const a=await req('/appInfos/'+i.id+'/appInfoLocalizations?limit=50');show('info',[i.id,i.attributes.appStoreState,a.map(x=>[x.attributes.locale,x.attributes.name,!!x.attributes.privacyPolicyUrl])])}\n for(const v of versions.filter(x=>['PREPARE_FOR_SUBMISSION','DEVELOPER_REJECTED','REJECTED','METADATA_REJECTED'].includes(x.attributes.appStoreState))){\n let loc=await req('/appStoreVersions/'+v.id+'/appStoreVersionLocalizations?limit=50');show('locales',loc.map(x=>[x.attributes.locale,!!x.attributes.description,!!x.attributes.keywords,!!x.attributes.supportUrl]));\n for(const sub of ['build','appStoreReviewDetail']){try {const x=await req('/appStoreVersions/'+v.id+'/'+sub);show(sub,sub==='build'?x?.attributes?.version??null:!!(x?.attributes?.contactFirstName&&x?.attributes?.contactLastName&&x?.attributes?.contactEmail&&x?.attributes?.contactPhone))}catch(err){show(sub,String(err).slice(0,180))}}\n }\n})().catch(e=>{console.error(e.message);process.exitCode=1});\nNODE"
        }
      ]
    }
  }
}