{
  "name": "ATMA public release preparation",
  "run-name": "Review public release settings and screenshot inventory",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "ATMA App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n\n(async()=>{\n const id='f2709e75-dbf7-450c-8d5e-634d8c310339',info='9ad9f9b7-9f03-4604-84b0-eea174112692';\n const l=await req('/appStoreVersions/'+id+'/appStoreVersionLocalizations?limit=50');\n for(const x of l) {const s=await req('/appStoreVersionLocalizations/'+x.id+'/appScreenshotSets?include=appScreenshots&limit=50');console.log('STORE14 LOCALE',x.attributes.locale,!!x.attributes.description,!!x.attributes.whatsNew,s.map(j=>[j.attributes.screenshotDisplayType,(j.relationships?.appScreenshots?.data||[]).length]));}\n for (const [key,path] of [['age','/appInfos/'+info+'/ageRatingDeclaration'],['availability','/apps/'+app+'/appAvailabilityV2'],['contentRights','/apps/'+app+'?fields[apps]=contentRightsDeclaration'],['build','/appStoreVersions/'+id+'/build?fields[builds]=version,usesNonExemptEncryption,processingState']]){\n try {const z=await req(path);if(key==='availability'){for(let url='/appAvailabilities/'+z.id+'/territoryAvailabilities?include=territory&limit=200';url;){const r=await fetch('https://api.appstoreconnect.apple.com/v1'+url,{headers:{Authorization:'Bearer '+jwt}});const v=await r.json();if(!v.data){console.log('STORE14',r.status);break;}for(const a of v.data){const c=a.relationships?.territory?.data?.id;if(['RUS','USA','DEU','FRA','BRA','PRT','JPN','CHN','KOR','ESP','ITA','GBR'].includes(c))console.log('STORE14 MARKET',c,a.attributes.available,a.attributes.contentStatuses);}url=v.links?.next?.replace('https://api.appstoreconnect.apple.com/v1','');}}\n else console.log('STORE14',key,key==='age'?'declared with '+Object.keys(z.attributes).length+' fields':JSON.stringify(z.attributes));}\n catch(err){console.log('STORE14 CHECK',key,err.message);}}\n})().catch(err=>{console.error(err.message);process.exitCode=1})\nNODE"
        }
      ]
    }
  }
}