{
  "name": "ATMA — read TestFlight build status",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "build": {
          "description": "ATMA 1.0.1 build number",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "status": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 12,
      "steps": [
        {
          "name": "Read Apple build processing and internal access",
          "env": {
            "ATMA_BUILD_NUMBER": "${{ inputs.build }}",
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          },
          "run": "node - <<'JS'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst env=process.env,build=env.ATMA_BUILD_NUMBER,version='1.0.1';\nif (!/^\\d{1,9}$/.test(build || '')) throw Error('Invalid build number');\nconst encode=value=>Buffer.from(JSON.stringify(value)).toString('base64url');\nconst key=createPrivateKey(env.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nfunction authorization(){\n  const now=Math.floor(Date.now()/1000);\n  const header=encode({alg:'ES256',kid:env.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'});\n  const claims=encode({iss:env.APP_STORE_CONNECT_ISSUER_ID,iat:now,exp:now+600,aud:'appstoreconnect-v1'});\n  const data=header+'.'+claims;\n  return 'Bearer '+data+'.'+sign('sha256',Buffer.from(data),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\n}\nconst endpoint=new URL('https://api.appstoreconnect.apple.com/v1/builds');\nendpoint.search=new URLSearchParams({'filter[app]':'6826668990','filter[version]':build,\n  include:'preReleaseVersion,buildBetaDetail,betaGroups',limit:'25'});\nconst terminal=new Set(['IN_BETA_TESTING','PROCESSING_EXCEPTION','MISSING_EXPORT_COMPLIANCE','EXPIRED','IN_EXPORT_COMPLIANCE_REVIEW']);\n(async()=>{\n  let last='';\n  for(let attempt=0;attempt<18;attempt++){\n    let state={version,build,processing:'NOT_LISTED'};\n    const response=await fetch(endpoint,{headers:{Authorization:authorization()},signal:AbortSignal.timeout(20000),redirect:'error'});\n    if(response.ok){\n      const content=await response.json();\n      const byId=new Map((content.included||[]).map(v=>[v.type+'/'+v.id,v.attributes]));\n      const resolve=rel=>rel?.data&&byId.get(rel.data.type+'/'+rel.data.id);\n      const result=content.data.find(x=>resolve(x.relationships.preReleaseVersion)?.version===version);\n      if(result){\n        const detail=resolve(result.relationships.buildBetaDetail);\n        const groups=(result.relationships.betaGroups?.data||[]).map(g=>byId.get(g.type+'/'+g.id));\n        state={version,build,id:result.id,processing:result.attributes.processingState,uploaded:result.attributes.uploadedDate,\n          internal:detail?.internalBuildState,groups:groups.filter(g=>g?.isInternalGroup).map(g=>g.name)};\n      }\n    }else if([429,500,502,503,504].includes(response.status)){state.retryHTTP=response.status}\n    else {const errors=(await response.json().catch(()=>({}))).errors||[];throw Error('Apple HTTP '+response.status+' '+errors.map(e=>e.code).join(','))}\n    const sample=JSON.stringify(state);\n    if(sample!==last){console.log('ATMA_STATUS '+sample);last=sample}\n    if(['INVALID','FAILED'].includes(state.processing)||terminal.has(state.internal))return;\n    if(attempt<17)await new Promise(resolve=>setTimeout(resolve,30000));\n  }\n})().catch(error=>{console.error(error.message);process.exitCode=1});\nJS"
        }
      ]
    }
  }
}

