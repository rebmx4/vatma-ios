{
  "name": "ATMA public release preparation",
  "run-name": "Transfer approved artwork from the private release draft",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Download approved campaign archive",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -eu\ngh api repos/rebmx4/vatma-ios/releases/460776883 > release.json\njq -e '.draft == true and .tag_name == \"atma-store-media-1.0.1-14-20261127\"' release.json > /dev/null\nasset=$(jq -er '.assets[]|select(.state==\"uploaded\" and .name==\"store-1.0.1-14.zip\")|.id' release.json)\ngh api -H \"Accept: application/octet-stream\" \"repos/rebmx4/vatma-ios/releases/assets/$asset\" > gallery.zip\necho '2a7154aa28463822775dd477561b9dd7cbb06448f5e45a6f9a4f7da2d853a752  gallery.zip' | sha256sum -c -\nmkdir package\nunzip -q gallery.zip -d package"
        },
        {
          "name": "ATMA App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n\n\nconst fs=require('node:fs'), {createHash}=require('node:crypto');\nconst version='f2709e75-dbf7-450c-8d5e-634d8c310339', build='15f23a91-8e42-42fa-b598-2b06967b42f1';\nconst rows=JSON.parse(fs.readFileSync('package/screens.json','utf8'));\nconst bag=(type,id)=>({type,id});\nconst pause=ms=>new Promise(ok=>setTimeout(ok,ms));\nconst say=(...a)=>console.log('STORE14',...a);\nasync function order(setId,ids) {\n const r=await fetch('https://api.appstoreconnect.apple.com/v1/appScreenshotSets/'+setId+'/relationships/appScreenshots',{method:'PATCH',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:JSON.stringify({data:ids.map(id=>bag('appScreenshots',id))})});\n if(!r.ok){const j=await r.json();throw Error('order '+r.status+' '+j.errors?.[0]?.detail);}\n}\nasync function assets(id){return req('/appScreenshotSets/'+id+'/appScreenshots?limit=50');}\nasync function sets(id){return req('/appStoreVersionLocalizations/'+id+'/appScreenshotSets?limit=50');}\nasync function uploadOne(set,row,previous) {\n const bytes=fs.readFileSync('package/'+row.path);\n if(bytes.length!==row.size || createHash('md5').update(bytes).digest('hex')!==row.md5)throw Error('File validation '+row.name);\n let item=previous.find(x=>x.attributes.fileName===row.name);\n if(item && item.attributes.assetDeliveryState?.state==='FAILED'){\n  await req('/appScreenshots/'+item.id,'DELETE'); item=null;\n }\n if(!item)item=await req('/appScreenshots','POST',{type:'appScreenshots',attributes:{fileName:row.name,fileSize:row.size},relationships:{appScreenshotSet:{data:bag('appScreenshotSets',set.id)}}});\n const attr=item.attributes;\n if(attr.assetDeliveryState?.state==='COMPLETE'||attr.assetDeliveryState?.state==='UPLOAD_COMPLETE'){\n  if(attr.sourceFileChecksum && attr.sourceFileChecksum.toLowerCase()!==row.md5)throw Error('Checksum mismatch '+row.name);\n  return item.id;\n }\n let ops=attr.uploadOperations;\n if(!ops?.length){const ref=await req('/appScreenshots/'+item.id);ops=ref.attributes.uploadOperations;}\n if(!ops?.length)throw Error('Missing upload plan '+row.name);\n for(const op of ops) {\n  const url=new URL(op.url);\n  if(url.protocol!=='https:')throw Error('Non-HTTPS transfer');\n  const headers=Object.fromEntries((op.requestHeaders||[]).map(h=>[h.name,h.value]));\n  let success=false,code=0;\n  for(let attempt=0;attempt<4;attempt++){\n   try {const r=await fetch(url,{method:op.method,headers,body:bytes.subarray(op.offset,op.offset+op.length),redirect:'error',signal:AbortSignal.timeout(90000)});code=r.status;await r.arrayBuffer();if(r.ok){success=true;break;}}catch{code=0}\n   await pause(800*(attempt+1));\n  }\n  if(!success)throw Error('Transfer failed '+row.name+' HTTP '+code);\n }\n await req('/appScreenshots/'+item.id,'PATCH',{...bag('appScreenshots',item.id),attributes:{uploaded:true,sourceFileChecksum:row.md5}});\n return item.id;\n}\n(async()=>{\n const v=await req('/appStoreVersions/'+version), b=await req('/appStoreVersions/'+version+'/build');\n if(v.attributes.versionString!=='1.0.1'||v.attributes.appStoreState!=='PREPARE_FOR_SUBMISSION'||b.id!==build||b.attributes.version!=='14')throw Error('Unexpected version/state/build '+v.attributes.appStoreState);\n if(v.attributes.releaseType!=='AFTER_APPROVAL')throw Error('Unexpected release option '+v.attributes.releaseType);\n const locales=await req('/appStoreVersions/'+version+'/appStoreVersionLocalizations?limit=50');\n if(rows.length!==110||new Set(rows.map(x=>x.path)).size!==110||new Set(rows.map(x=>x.loc)).size!==11)throw Error('Invalid gallery');\n const jobs=[];\n for(const [loc,record] of Object.entries(Object.fromEntries(locales.map(x=>[x.attributes.locale,x])))){\n  if(!rows.some(x=>x.loc===loc))continue;\n  if(!record.attributes.description||!record.attributes.whatsNew)throw Error('Missing text '+loc);\n  const existing=await sets(record.id);\n  for(const [device,fmt] of [['iphone','APP_IPHONE_67'],['ipad','APP_IPAD_PRO_3GEN_129']]){\n   let set=existing.find(x=>x.attributes.screenshotDisplayType===fmt);\n   if(!set)set=await req('/appScreenshotSets','POST',{type:'appScreenshotSets',attributes:{screenshotDisplayType:fmt},relationships:{appStoreVersionLocalization:{data:bag('appStoreVersionLocalizations',record.id)}}});\n   jobs.push({loc,device,set,files:rows.filter(x=>x.loc===loc&&x.device===device).sort((a,b)=>a.order-b.order)});\n  }\n }\n if(jobs.length!==22)throw Error('Expected 22 sets, found '+jobs.length);\n let next=0;\n await Promise.all(Array.from({length:4},async()=>{while(next<jobs.length){\n  const job=jobs[next++],previous=await assets(job.set.id);\n  job.ids=[];\n  for(const row of job.files)job.ids.push(await uploadOne(job.set,row,previous));\n  say('DELIVERED',job.loc,job.device,job.ids.length);\n }}));\n for(let t=0;t<24;t++){\n  let pending=0;\n  for(const job of jobs){\n   const snapshots=await assets(job.set.id);\n   for(const [i,id] of job.ids.entries()){const shot=snapshots.find(x=>x.id===id);\n    const state=shot?.attributes?.assetDeliveryState?.state;\n    if(state==='FAILED')throw Error('Processing failed '+job.files[i].name+' '+JSON.stringify(shot.attributes.assetDeliveryState.errors));\n    if(state!=='COMPLETE')pending++;\n    else if(shot.attributes.sourceFileChecksum?.toLowerCase()!==job.files[i].md5)throw Error('Invalid completed checksum '+job.files[i].name);\n   }\n  }\n  if(!pending)break;if(t===23)throw Error('Processing still pending '+pending);say('PROCESSING',pending);await pause(6000);\n }\n const versions=await req('/apps/'+app+'/appStoreVersions?filter[platform]=IOS&limit=30');\n const old=versions.find(v=>v.attributes.versionString==='1.0.0');if(!old)throw Error('Missing predecessor');\n const protectedSet=new Set(),protectedAsset=new Set();\n for(const l of await req('/appStoreVersions/'+old.id+'/appStoreVersionLocalizations?limit=50'))for(const s of await sets(l.id)){protectedSet.add(s.id);for(const a of await assets(s.id))protectedAsset.add(a.id);}\n for(const job of jobs){\n  if(protectedSet.has(job.set.id))throw Error('Published screenshot set shared');\n  const before=await assets(job.set.id);\n  for(const stale of before.filter(x=>!job.ids.includes(x.id))){\n   if(protectedAsset.has(stale.id)||job.loc!=='ru'||stale.attributes.fileName.startsWith('ATMA-14-'))throw Error('Unexpected existing asset '+job.loc);\n   await req('/appScreenshots/'+stale.id,'DELETE');\n  }\n  const current=await assets(job.set.id);\n  if(current.map(x=>x.id).join()!==job.ids.join())await order(job.set.id,job.ids);\n  const actual=await assets(job.set.id);if(actual.map(x=>x.id).join()!==job.ids.join())throw Error('Invalid order '+job.loc);\n }\n say('VERIFIED',jobs.length,'sets',rows.length,'ordered and processed');\n})().catch(error=>{console.error('STORE14 ISSUE',error.message);process.exitCode=1});\n\nNODE"
        }
      ],
      "permissions": {
        "contents": "write"
      }
    }
  }
}