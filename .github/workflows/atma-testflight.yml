{
  "name": "ATMA public release preparation",
  "run-name": "Localize ATMA 14 draft",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "payload": {
          "description": "Approved compressed localized listing metadata",
          "type": "string",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "ATMA App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
            "DRAFT_METADATA": "${{ inputs.payload }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n(async()=>{\nconst wanted=['ru','en-US','de-DE','fr-FR','pt-BR','pt-PT','ja','zh-Hans','ko','es-ES','it'];\nconst meta=JSON.parse(require('node:zlib').gunzipSync(Buffer.from(e.DRAFT_METADATA,'base64')).toString());\nif(wanted.length!==meta.length||!wanted.every(l=>meta.filter(m=>m.locale===l).length===1))throw Error('Unexpected locale set');\nconst live=await req('/apps/'+app+'/appStoreVersions?limit=30');\nconst draft=live.find(x=>x.attributes.platform==='IOS'&&x.attributes.versionString==='1.0.1'&&x.attributes.appStoreState==='PREPARE_FOR_SUBMISSION');\nif(draft?.id!=='f2709e75-dbf7-450c-8d5e-634d8c310339')throw Error('Wrong version');\nconst inf=(await req('/apps/'+app+'/appInfos?limit=30')).find(x=>x.attributes.appStoreState==='PREPARE_FOR_SUBMISSION');\nif(inf?.id!=='9ad9f9b7-9f03-4604-84b0-eea174112692')throw Error('Wrong app info');\nconst infoRows=await req('/appInfos/'+inf.id+'/appInfoLocalizations?limit=60');\nconst vRows=await req('/appStoreVersions/'+draft.id+'/appStoreVersionLocalizations?limit=60');\nlet failed=false;\nfor(const m of meta){\n  for(const [rows,type,parent,related,fields] of [[infoRows,'appInfoLocalizations',inf,'appInfo',['name','subtitle','privacyPolicyUrl']],[vRows,'appStoreVersionLocalizations',draft,'appStoreVersion',['description','keywords','marketingUrl','promotionalText','supportUrl','whatsNew']]]){\n    const old=rows.find(x=>x.attributes.locale===m.locale);\n    const attributes=Object.fromEntries(fields.map(k=>[k,m[k]]));\n    if(Object.values(attributes).some(s=>!s||typeof s!=='string'))throw Error('Missing field '+m.locale);\n    try{\n      if(old){if(fields.some(k=>old.attributes[k]!==m[k]))await req('/'+type+'/'+old.id,'PATCH',{type,id:old.id,attributes})}\n      else await req('/'+type,'POST',{type,attributes:{...attributes,locale:m.locale},relationships:{[related]:{data:{type:parent.type,id:parent.id}}}});\n      console.log('STORE14 SAVED '+m.locale+' '+type);\n    }catch(err){console.log('STORE14 ISSUE '+m.locale+' '+type+' '+err.message);failed=true;}\n  }\n}\nif(failed)process.exitCode=1;\n})().catch(e=>{console.error(e.message);process.exitCode=1});\nNODE"
        }
      ]
    }
  }
}