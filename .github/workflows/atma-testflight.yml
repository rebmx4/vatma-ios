{
  "name": "ATMA public release preparation",
  "run-name": "Submit ATMA 1.0.1 build 14 for public App Review",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Download approved campaign archive",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -eu\ngh api repos/rebmx4/vatma-ios/releases/460776883 > release.json\njq -e '.draft == true and .tag_name == \"atma-store-media-1.0.1-14-20261127\"' release.json > /dev/null\nasset=$(jq -er '.assets[]|select(.state==\"uploaded\" and .name==\"store-1.0.1-14.zip\")|.id' release.json)\ngh api -H \"Accept: application/octet-stream\" \"repos/rebmx4/vatma-ios/releases/assets/$asset\" > gallery.zip\necho '2a7154aa28463822775dd477561b9dd7cbb06448f5e45a6f9a4f7da2d853a752  gallery.zip' | sha256sum -c -\nmkdir package\nunzip -q gallery.zip -d package"
        },
        {
          "name": "ATMA App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n\n\nconst fs=require('node:fs'),version='f2709e75-dbf7-450c-8d5e-634d8c310339',build='15f23a91-8e42-42fa-b598-2b06967b42f1';\nconst obj=(type,id)=>({type,id}), ref=(type,id)=>({data:obj(type,id)});\nconst pause=ms=>new Promise(ok=>setTimeout(ok,ms));\nconst say=(...x)=>console.log('STORE14',...x);\n(async()=>{\n const v=await req('/appStoreVersions/'+version),b=await req('/appStoreVersions/'+version+'/build');\n if(v.attributes.versionString!=='1.0.1'||b.id!==build||b.attributes.version!=='14'||v.attributes.releaseType!=='AFTER_APPROVAL')throw Error('Version, build or release setting mismatch');\n if(!['PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED'].includes(v.attributes.appStoreState)) {\n   say('CURRENT',v.attributes.appStoreState);return;\n }\n const rows=JSON.parse(fs.readFileSync('package/screens.json','utf8'));\n const ls=await req('/appStoreVersions/'+version+'/appStoreVersionLocalizations?limit=50');\n let completed=0;\n for(const l of ls){\n  const locale=l.attributes.locale, has=rows.filter(r=>r.loc===locale);\n  if(!has.length)continue;\n  if(!l.attributes.description||!l.attributes.whatsNew||!l.attributes.supportUrl)throw Error('Incomplete localization '+locale);\n  const sets=await req('/appStoreVersionLocalizations/'+l.id+'/appScreenshotSets?limit=50');\n  for(const [dev,format] of [['iphone','APP_IPHONE_67'],['ipad','APP_IPAD_PRO_3GEN_129']]){\n   const set=sets.find(s=>s.attributes.screenshotDisplayType===format);\n   if(!set)throw Error('Missing media set '+locale+' '+dev);\n   const screens=await req('/appScreenshotSets/'+set.id+'/appScreenshots?limit=50');\n   const expected=has.filter(r=>r.device===dev).sort((a,b)=>a.order-b.order);\n   if(screens.length!==5||expected.length!==5||screens.some((s,i)=>s.attributes.assetDeliveryState.state!=='COMPLETE'||s.attributes.fileName!==expected[i].name||s.attributes.sourceFileChecksum?.toLowerCase()!==expected[i].md5))throw Error('Gallery has not completed final verification '+locale+' '+dev);\n   completed+=screens.length;\n  }\n }\n if(completed!==110)throw Error('Unexpected final screenshot count '+completed);say('CHECKED',completed,'screenshots',b.attributes.version,v.attributes.releaseType);\n const note=fs.readFileSync('package/review-notes.txt','utf8'),detail=await req('/appStoreVersions/'+version+'/appStoreReviewDetail');\n if(note.length>4000||!note.includes('Version 1.0.1 (14)'))throw Error('Invalid review notes');\n if(v.attributes.appStoreState==='PREPARE_FOR_SUBMISSION'&&detail.attributes.notes!==note)await req('/appStoreReviewDetails/'+detail.id,'PATCH',{...obj('appStoreReviewDetails',detail.id),attributes:{notes:note}});\n const states=await req('/apps/'+app+'/reviewSubmissions?filter[platform]=IOS&include=appStoreVersionForReview&limit=100');\n let submission=null,found=false;\n for(const s of states) {\n  if(!['READY_FOR_REVIEW','WAITING_FOR_REVIEW','IN_REVIEW','UNRESOLVED_ISSUES','COMPLETING'].includes(s.attributes.state))continue;\n  const items=await req('/reviewSubmissions/'+s.id+'/items?include=appStoreVersion&limit=50');\n  const same=items.some(item=>item.relationships?.appStoreVersion?.data?.id===version);\n  if(same && s.attributes.state!=='READY_FOR_REVIEW'){say('APPLE',s.id,s.attributes.state,v.attributes.appStoreState);return;}\n  if(same&&items.length!==1)throw Error('Review draft also contains other items');\n  if(same){submission=s;found=true;break}\n  if(s.attributes.state==='READY_FOR_REVIEW' && !items.length)submission=s;\n }\n if(!submission)submission=await req('/reviewSubmissions','POST',{type:'reviewSubmissions',attributes:{platform:'IOS'},relationships:{app:ref('apps',app)}});\n if(!found)await req('/reviewSubmissionItems','POST',{type:'reviewSubmissionItems',relationships:{reviewSubmission:ref('reviewSubmissions',submission.id),appStoreVersion:ref('appStoreVersions',version)}});\n const finalItems=await req('/reviewSubmissions/'+submission.id+'/items?include=appStoreVersion&limit=50');\n if(finalItems.length!==1||finalItems[0].relationships?.appStoreVersion?.data?.id!==version)throw Error('Review item verification failed');\n const response=await req('/reviewSubmissions/'+submission.id,'PATCH',{...obj('reviewSubmissions',submission.id),attributes:{submitted:true}});\n say('SUBMITTED',response.id,response.attributes.state);\n for(let k=0;k<6;k++){const checked=await req('/reviewSubmissions/'+submission.id),actual=await req('/appStoreVersions/'+version);\n say('APPLE',checked.id,checked.attributes.state,actual.attributes.appStoreState,actual.attributes.releaseType,checked.attributes.submittedDate);\n if(['WAITING_FOR_REVIEW','IN_REVIEW','COMPLETE','COMPLETING'].includes(checked.attributes.state))return;await pause(4000);}\n throw Error('Apple has not yet confirmed submission state');\n})().catch(error=>{console.error('STORE14 ISSUE',error.message);process.exitCode=1});\n\nNODE"
        }
      ],
      "permissions": {
        "contents": "write"
      }
    }
  }
}