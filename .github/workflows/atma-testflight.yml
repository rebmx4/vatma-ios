{
  "name": "ATMA App Store operations",
  "run-name": "Withdraw ATMA submission to update promotional screenshots",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n\n\n(async()=>{\nconst version='f2709e75-dbf7-450c-8d5e-634d8c310339',id='4e262179-8945-4937-b113-2e6609cbd638';\nconst v=await req('/appStoreVersions/'+version),r=await req('/reviewSubmissions/'+id);\nconst state=v.attributes.appStoreState;\nconsole.log('STORE14 BEFORE',state,r.attributes.state);\nif(!['WAITING_FOR_REVIEW','IN_REVIEW','PENDING_DEVELOPER_RELEASE','PENDING_APPLE_RELEASE','WAITING_FOR_EXPORT_COMPLIANCE'].includes(state)){return;}\nconst items=await req('/reviewSubmissions/'+id+'/items?include=appStoreVersion&limit=50');\nif(items.length!==1||items[0].relationships?.appStoreVersion?.data?.id!==version)throw Error('Unexpected review contents');\nconst cancelled=await req('/reviewSubmissions/'+id,'PATCH',{type:'reviewSubmissions',id,attributes:{canceled:true}});\nconsole.log('STORE14 CANCELED',cancelled.attributes.state);\nfor(let i=0;i<10;i++){const s=(await req('/appStoreVersions/'+version)).attributes.appStoreState;console.log('STORE14 VERSION',s);if(s==='DEVELOPER_REJECTED')return;await new Promise(ok=>setTimeout(ok,3000));}\n})().catch(e=>{console.error('STORE14 ISSUE',e.message);process.exitCode=1});\nNODE"
        }
      ]
    }
  }
}