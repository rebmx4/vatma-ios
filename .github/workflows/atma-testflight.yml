{
    "name":  "ATMA 2 - signed IPA and TestFlight upload",
    "run-name":  "ATMA TestFlight - ${{ inputs.revision }}",
    "on":  {
               "workflow_dispatch":  {
                                         "inputs":  {
                                                        "revision":  {
                                                                         "description":  "Exact source SHA from successful native check artifact",
                                                                         "required":  true,
                                                                         "type":  "string"
                                                                     },
                                                        "verified_run_id":  {
                                                                                "description":  "Successful ATMA 1 GitHub Actions run ID",
                                                                                "required":  true,
                                                                                "type":  "string"
                                                                            },
                                                        "upload_to_testflight":  {
                                                                                     "description":  "Upload binary to App Store Connect (separate owner authorization)",
                                                                                     "required":  true,
                                                                                     "type":  "boolean",
                                                                                     "default":  false
                                                                                 }
                                                    }
                                     }
           },
    "permissions":  {
                        "contents":  "read",
                        "actions":  "read"
                    },
    "concurrency":  {
                        "group":  "atma-signing",
                        "cancel-in-progress":  false
                    },
    "defaults":  {
                     "run":  {
                                 "shell":  "bash"
                             }
                 },
    "jobs":  {
                 "verification":  {
                                      "runs-on":  "ubuntu-latest",
                                      "timeout-minutes":  70,
                                      "steps":  [
                                                    {
                                                        "name":  "Wait for the native verification run",
                                                        "env":  {
                                                                    "GH_TOKEN":  "${{ github.token }}",
                                                                    "VERIFIED_RUN_ID":  "${{ inputs.verified_run_id }}"
                                                                },
                                                        "run":  "set -euo pipefail\nfor ((attempt=0; attempt\u003c133; attempt++)); do\n  result=\"$(gh run view \"$VERIFIED_RUN_ID\" --repo \"$GITHUB_REPOSITORY\" --json status,conclusion --jq \u0027[.status,.conclusion]|join(\"/\")\u0027)\"\n  case \"$result\" in\n    completed/success) exit 0 ;;\n    completed/*) echo \"Native checks did not pass: $result\"; exit 1 ;;\n    *) echo \"Native checks: $result\"; sleep 30 ;;\n  esac\ndone\necho \u0027Native checks did not finish within the wait period\u0027\nexit 1"
                                                    }
                                                ]
                                  },
                 "ios":  {
                             "name":  "Verify provenance, sign and optionally upload",
                             "runs-on":  "macos-26",
                             "timeout-minutes":  30,
                             "env":  {
                                         "DEVELOPER_DIR":  "/Applications/Xcode_26.4.app/Contents/Developer",
                                         "CM_BUILD_DIR":  "${{ github.workspace }}",
                                         "HOMEBREW_NO_AUTO_UPDATE":  "1",
                                         "PYTHONDONTWRITEBYTECODE":  "1",
                                         "SOURCE_REVISION":  "${{ inputs.revision }}",
                                         "VERIFIED_RUN_ID":  "${{ inputs.verified_run_id }}"
                                     },
                             "steps":  [
                                           {
                                               "name":  "Checkout requested source",
                                               "uses":  "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
                                               "with":  {
                                                            "ref":  "${{ inputs.revision }}",
                                                            "persist-credentials":  false
                                                        }
                                           },
                                           {
                                               "name":  "Use Python 3.12",
                                               "uses":  "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
                                               "with":  {
                                                            "python-version":  "3.12"
                                                        }
                                           },
                                           {
                                               "name":  "Fetch successful native run metadata",
                                               "env":  {
                                                           "GH_TOKEN":  "${{ github.token }}"
                                                       },
                                               "run":  "[[ \"$SOURCE_REVISION\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$VERIFIED_RUN_ID\" =~ ^[1-9][0-9]*$ ]]\ntest \"$SOURCE_REVISION\" = \"$(git rev-parse HEAD)\"\nmkdir -p out\ncurl --fail --silent --show-error -H \"Authorization: Bearer $GH_TOKEN\" -H \"Accept: application/vnd.github+json\" \"https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID\" -o out/native-run.json"
                                           },
                                           {
                                               "name":  "Download native verification evidence",
                                               "uses":  "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
                                               "with":  {
                                                            "name":  "atma-native-${{ inputs.verified_run_id }}",
                                                            "run-id":  "${{ inputs.verified_run_id }}",
                                                            "github-token":  "${{ github.token }}",
                                                            "path":  "out/verified-native"
                                                        }
                                           },
                                           {
                                               "name":  "Require successful native run and exact source SHA",
                                               "run":  "verified=\"$(python3 -B release/github_ci.py gate --run out/native-run.json --verified out/verified-native/verified-commit.txt --repository \"$GITHUB_REPOSITORY\" --run-id \"$VERIFIED_RUN_ID\" --revision \"$(git rev-parse HEAD)\")\"\nprintf \"ATMA_VERIFIED_COMMIT=%s\\n\" \"$verified\" \u003e\u003e \"$GITHUB_ENV\""
                                           },
                                           {
                                               "name":  "Require Apple signing secrets",
                                               "env":  {
                                                           "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                           "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                           "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
                                                           "CERT_KEY_B64":  "${{ secrets.CERT_KEY_B64 }}"
                                                       },
                                               "run":  "python3 - \u003c\u003c\u0027PY\u0027\nimport os\nnames = (\"APP_STORE_CONNECT_ISSUER_ID\", \"APP_STORE_CONNECT_KEY_IDENTIFIER\", \"APP_STORE_CONNECT_PRIVATE_KEY\", \"CERT_KEY_B64\")\nmissing = [name for name in names if not os.environ.get(name)]\nif missing:\n    raise SystemExit(\"Missing GitHub secrets: \" + \", \".join(missing))\nPY"
                                           },
                                           {
                                               "name":  "Apply existing revision gate",
                                               "run":  "bash release/ci.sh gate"
                                           },
                                           {
                                               "name":  "Validate sources and generate Xcode project",
                                               "run":  "bash release/ci.sh prepare"
                                           },
                                           {
                                               "name":  "Install pinned Apple signing tools in workspace",
                                               "run":  "python3 -m venv .cache/release-tools\n.cache/release-tools/bin/python -m pip install --disable-pip-version-check codemagic-cli-tools==0.70.0\nprintf \"%s\\n\" \"$GITHUB_WORKSPACE/.cache/release-tools/bin\" \u003e\u003e \"$GITHUB_PATH\""
                                           },
                                           {
                                               "name":  "Sign, archive, export and validate IPA",
                                               "env":  {
                                                           "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                           "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                           "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
                                                           "CERT_KEY_B64":  "${{ secrets.CERT_KEY_B64 }}"
                                                       },
                                               "run":  "bash release/ci.sh archive"
                                           },
                                           {
                                               "name":  "Record the verified build number",
                                               "id":  "build_info",
                                               "run":  "set -euo pipefail\nnumber=\"$(cat out/build-number.txt)\"\n[[ \"$number\" =~ ^[1-9][0-9]*$ ]]\nprintf \u0027number=%s\\n\u0027 \"$number\" \u003e\u003e \"$GITHUB_OUTPUT\""
                                           },
                                           {
                                               "name":  "Upload validated binary to App Store Connect",
                                               "if":  "${{ inputs.upload_to_testflight }}",
                                               "env":  {
                                                           "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                           "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                           "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
                                                       },
                                               "run":  "app-store-connect publish --path \"out/ipa/ATMA.ipa\" --enable-package-validation"
                                           },
                                           {
                                               "name":  "Save signed IPA and validation logs",
                                               "if":  "${{ always() }}",
                                               "uses":  "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
                                               "with":  {
                                                            "name":  "atma-signed-${{ github.run_id }}",
                                                            "path":  "out/ipa/*.ipa\nout/*.json\nout/*.log\nout/build-number.txt",
                                                            "retention-days":  1,
                                                            "if-no-files-found":  "warn",
                                                            "overwrite":  true
                                                        }
                                           }
                                       ],
                             "needs":  "verification",
                             "outputs":  {
                                             "build_number":  "${{ steps.build_info.outputs.number }}"
                                         }
                         },
                 "distribute":  {
                                    "runs-on":  "ubuntu-latest",
                                    "timeout-minutes":  75,
                                    "steps":  [
                                                  {
                                                      "name":  "Verify processing and distribute to ATMA TestFlight groups",
                                                      "env":  {
                                                                  "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                                  "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                                  "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
                                                                  "ATMA_BUILD_NUMBER":  "${{ needs.ios.outputs.build_number }}"
                                                              },
                                                      "run":  "node - <<'JS'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst env=process.env;\nconst key=createPrivateKey(env.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst app='6826668990';\nconst buildNumber=env.ATMA_BUILD_NUMBER;\nif(!/^[1-9][0-9]*$/.test(buildNumber))throw Error('Invalid expected build number');\nconst encode=value=>Buffer.from(JSON.stringify(value)).toString('base64url');\nfunction token(){\n const now=Math.floor(Date.now()/1000);\n const payload=encode({alg:'ES256',kid:env.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+encode({iss:env.APP_STORE_CONNECT_ISSUER_ID,iat:now,exp:now+600,aud:'appstoreconnect-v1'});\n return payload+'.'+sign('sha256',Buffer.from(payload),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\n}\n\nconst desiredGroups = new Map([\n ['c1231ead-b3b9-41f5-9729-1eb911c94c97', {name:'Test', internal:true}],\n ['d33d96df-5e15-4778-b996-af769afe76b2', {name:'Test1', internal:false}],\n ['da39915e-2642-422b-aa5d-203e5064a343', {name:'\u0442\u043e\u043b\u043f\u0430', internal:false}],\n]);\nconst sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\nasync function request(path, method='GET', body) {\n const res = await fetch('https://api.appstoreconnect.apple.com/v1'+path,{\n  method, headers:{Authorization:'Bearer '+token(), Accept:'application/json', ...(body?{'Content-Type':'application/json'}:{})},\n  body:body?JSON.stringify(body):undefined, signal:AbortSignal.timeout(25000), redirect:'error'\n });\n if(res.status===204) return null;\n const json=await res.json();\n if(!res.ok) throw Error('Apple HTTP '+res.status+' '+JSON.stringify((json.errors||[]).map(({code,title,detail})=>({code,title,detail}))));\n return json;\n}\nasync function findBuild() {\n const query=new URLSearchParams({'filter[app]':app,'filter[version]':buildNumber,include:'preReleaseVersion',limit:'50'});\n for(let tries=0;tries<120;tries++){\n  const response=await request('/builds?'+query);\n  const candidate=response.data.find(row=>{\n   const route=row.relationships.preReleaseVersion?.data?.id;\n   const version=response.included?.find(item=>item.type==='preReleaseVersions'&&item.id===route);\n   return row.attributes.version===buildNumber&&version?.attributes.version==='1.0.1'&&version?.attributes.platform==='IOS';\n  });\n  if(candidate?.attributes.expired)throw Error('ATMA build '+buildNumber+' has expired');\n  if(candidate?.attributes.processingState==='VALID')return candidate.id;\n  if(['INVALID','FAILED'].includes(candidate?.attributes.processingState))throw Error('Apple processing failed: '+candidate.attributes.processingState);\n  console.log('PROCESSING '+(candidate?.attributes.processingState??'waiting for Apple to make the build available'));\n  await sleep(35000);\n }\n throw Error('ATMA build '+buildNumber+' is still pending processing at Apple');\n}\nconst notes={\n ru:'\u041f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u0441\u043a\u0430\u0447\u0438\u0432\u0430\u043d\u0438\u0435 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 \u0444\u0430\u0439\u043b\u043e\u0432, \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u0435 \u0433\u043e\u0442\u043e\u0432\u043e\u0433\u043e \u0444\u0430\u0439\u043b\u0430 \u0438 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u0443\u044e \u043a\u043d\u043e\u043f\u043a\u0443 \u0441\u043f\u0438\u0441\u043a\u0430 \u0437\u0430\u0433\u0440\u0443\u0437\u043e\u043a. \u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043f\u0430\u043f\u043a\u0443, \u043f\u0435\u0440\u0435\u043b\u0438\u0441\u0442\u043d\u0443\u0442\u044c \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443 \u0432\u0442\u043e\u0440\u044b\u043c \u043f\u0430\u043b\u044c\u0446\u0435\u043c, \u0438\u0437\u043c\u0435\u043d\u0438\u0442\u044c \u0446\u0432\u0435\u0442 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u0430 \u0438 \u0434\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u044f\u0440\u043b\u044b\u043a \u0441\u0430\u0439\u0442\u0430.',\n 'en-US':'Try downloading several files, opening a completed file, and tapping the separate downloads list button. Create a shortcut folder, swipe between pages with a second finger, choose an accent color, and add a site to the desktop.'\n};\nasync function releaseNotes(build) {\n const localizations=(await request('/builds/'+build+'/betaBuildLocalizations?limit=50')).data;\n for(const [locale,whatsNew] of Object.entries(notes)){\n  const existing=localizations.find(row=>row.attributes.locale.toLowerCase()===locale.toLowerCase());\n  if(existing?.attributes.whatsNew?.trim())continue;\n  if(existing){\n   await request('/betaBuildLocalizations/'+existing.id,'PATCH',{data:{type:'betaBuildLocalizations', id:existing.id, attributes:{whatsNew}}});\n  }else{\n   await request('/betaBuildLocalizations','POST',{data:{type:'betaBuildLocalizations', attributes:{locale,whatsNew},relationships:{build:{data:{type:'builds',id:build}}}}});\n  }\n }\n}\nasync function main() {\n const build=await findBuild();\n console.log('BUILD_ID '+build);\n const groups=(await request('/apps/'+app+'/betaGroups?limit=200')).data;\n for(const [id, expected] of desiredGroups) {\n  const actual=groups.find(group=>group.id===id)?.attributes;\n  if(actual?.name!==expected.name||actual.isInternalGroup!==expected.internal)throw Error('Missing expected TestFlight group: '+expected.name);\n }\n await releaseNotes(build);\n const hasBuild=async id=>{\n  const links=(await request('/betaGroups/'+id+'/relationships/builds?limit=200')).data;\n  return links.some(row=>row.id===build);\n };\n for(const [id,group] of desiredGroups){\n  if(await hasBuild(id))continue;\n  await request('/betaGroups/'+id+'/relationships/builds','POST',{data:[{type:'builds',id:build}]});\n  console.log('ADDED '+group.name);\n }\n const confirmed=[];\n for(const [id,group] of desiredGroups){\n  if(!await hasBuild(id))throw Error('The tester group link was not confirmed: '+group.name);\n  confirmed.push(group.name);\n }\n console.log('BUILD_GROUPS '+JSON.stringify(confirmed));\n const details=async()=>(await request('/builds/'+build+'/buildBetaDetail')).data.attributes;\n let state=await details();\n if(state.externalBuildState==='READY_FOR_BETA_SUBMISSION'){\n  await request('/betaAppReviewSubmissions','POST',{data:{type:'betaAppReviewSubmissions',relationships:{build:{data:{type:'builds',id:build}}}}});\n  state=await details();\n }\n console.log('BETA_DETAIL '+JSON.stringify(state));\n if(state.externalBuildState==='READY_FOR_BETA_TESTING'){\n  await request('/buildBetaNotifications','POST',{data:{type:'buildBetaNotifications',relationships:{build:{data:{type:'builds',id:build}}}}});\n }\n for(let tries=0;tries<9;tries++){\n  state=await details();\n  console.log('BETA_DETAIL '+JSON.stringify(state));\n  if(state.externalBuildState==='IN_BETA_TESTING')return;\n  if(['BETA_REJECTED','EXPIRED'].includes(state.externalBuildState))throw Error('External testing blocked: '+state.externalBuildState);\n  await sleep(15000);\n }\n}\nmain().catch(error=>{console.error(error.message);process.exitCode=1});\n\nJS"
                                                  }
                                              ],
                                    "needs":  "ios",
                                    "if":  "${{ inputs.upload_to_testflight }}"
                                }
             }
}
