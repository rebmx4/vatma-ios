{
  "name": "ATMA — upload signed build 10",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "atma-signing",
    "cancel-in-progress": false
  },
  "jobs": {
    "upload": {
      "runs-on": "macos-26",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Download the signed IPA",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "atma-signed-45911747533",
            "run-id": "45911747533",
            "github-token": "${{ github.token }}",
            "path": "signed"
          }
        },
        {
          "name": "Verify exact IPA and distribution signature",
          "run": "printf '%s  %s\\n' a70c8dcf31f2ca2e12400951d2d20cb407d362264994c7fff3c45a83b7759bdd signed/ipa/ATMA.ipa | shasum -a 256 -c -\nditto -x -k signed/ipa/ATMA.ipa extracted\ncodesign --verify --deep --strict extracted/Payload/ATMA.app\n/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' extracted/Payload/ATMA.app/Info.plist | grep -x 10"
        },
        {
          "name": "Install Apple upload CLI",
          "run": "python3 -m venv .upload-tools\n.upload-tools/bin/python -m pip install --disable-pip-version-check codemagic-cli-tools==0.70.0"
        },
        {
          "name": "Upload to App Store Connect",
          "env": {
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": ".upload-tools/bin/app-store-connect publish --path signed/ipa/ATMA.ipa --enable-package-validation"
        }
      ]
    }
  }
}
