{
    "name":  "ATMA 2 - signed IPA and TestFlight upload",
    "run-name":  "ATMA TestFlight - ${{ inputs.revision }}",
    "on":  {
               "workflow_dispatch":  {
                                         "inputs":  {
                                                        "revision":  {
                                                                         "description":  "Exact source SHA from successful native check artifact",
                                                                         "required":  true,
                                                                         "type":  "string"
                                                                     },
                                                        "verified_run_id":  {
                                                                                "description":  "Successful ATMA 1 GitHub Actions run ID",
                                                                                "required":  true,
                                                                                "type":  "string"
                                                                            },
                                                        "upload_to_testflight":  {
                                                                                     "description":  "Upload binary to App Store Connect (separate owner authorization)",
                                                                                     "required":  true,
                                                                                     "type":  "boolean",
                                                                                     "default":  false
                                                                                 }
                                                    }
                                     }
           },
    "permissions":  {
                        "contents":  "read",
                        "actions":  "read"
                    },
    "concurrency":  {
                        "group":  "atma-signing",
                        "cancel-in-progress":  false
                    },
    "defaults":  {
                     "run":  {
                                 "shell":  "bash"
                             }
                 },
    "jobs":  {
                 "verification":  {
                                      "runs-on":  "ubuntu-latest",
                                      "timeout-minutes":  70,
                                      "steps":  [
                                                    {
                                                        "name":  "Wait for the native verification run",
                                                        "env":  {
                                                                    "GH_TOKEN":  "${{ github.token }}",
                                                                    "VERIFIED_RUN_ID":  "${{ inputs.verified_run_id }}"
                                                                },
                                                        "run":  "set -euo pipefail\nfor ((attempt=0; attempt\u003c133; attempt++)); do\n  result=\"$(gh run view \"$VERIFIED_RUN_ID\" --repo \"$GITHUB_REPOSITORY\" --json status,conclusion --jq \u0027[.status,.conclusion]|join(\"/\")\u0027)\"\n  case \"$result\" in\n    completed/success) exit 0 ;;\n    completed/*) echo \"Native checks did not pass: $result\"; exit 1 ;;\n    *) echo \"Native checks: $result\"; sleep 30 ;;\n  esac\ndone\necho \u0027Native checks did not finish within the wait period\u0027\nexit 1"
                                                    }
                                                ]
                                  },
                 "ios":  {
                             "name":  "Verify provenance, sign and optionally upload",
                             "runs-on":  "macos-26",
                             "timeout-minutes":  30,
                             "env":  {
                                         "DEVELOPER_DIR":  "/Applications/Xcode_26.4.app/Contents/Developer",
                                         "CM_BUILD_DIR":  "${{ github.workspace }}",
                                         "HOMEBREW_NO_AUTO_UPDATE":  "1",
                                         "PYTHONDONTWRITEBYTECODE":  "1",
                                         "SOURCE_REVISION":  "${{ inputs.revision }}",
                                         "VERIFIED_RUN_ID":  "${{ inputs.verified_run_id }}"
                                     },
                             "steps":  [
                                           {
                                               "name":  "Checkout requested source",
                                               "uses":  "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
                                               "with":  {
                                                            "ref":  "${{ inputs.revision }}",
                                                            "persist-credentials":  false
                                                        }
                                           },
                                           {
                                               "name":  "Use Python 3.12",
                                               "uses":  "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
                                               "with":  {
                                                            "python-version":  "3.12"
                                                        }
                                           },
                                           {
                                               "name":  "Fetch successful native run metadata",
                                               "env":  {
                                                           "GH_TOKEN":  "${{ github.token }}"
                                                       },
                                               "run":  "[[ \"$SOURCE_REVISION\" =~ ^[a-f0-9]{40}$ ]]\n[[ \"$VERIFIED_RUN_ID\" =~ ^[1-9][0-9]*$ ]]\ntest \"$SOURCE_REVISION\" = \"$(git rev-parse HEAD)\"\nmkdir -p out\ncurl --fail --silent --show-error -H \"Authorization: Bearer $GH_TOKEN\" -H \"Accept: application/vnd.github+json\" \"https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID\" -o out/native-run.json"
                                           },
                                           {
                                               "name":  "Download native verification evidence",
                                               "uses":  "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
                                               "with":  {
                                                            "name":  "atma-native-${{ inputs.verified_run_id }}",
                                                            "run-id":  "${{ inputs.verified_run_id }}",
                                                            "github-token":  "${{ github.token }}",
                                                            "path":  "out/verified-native"
                                                        }
                                           },
                                           {
                                               "name":  "Require successful native run and exact source SHA",
                                               "run":  "verified=\"$(python3 -B release/github_ci.py gate --run out/native-run.json --verified out/verified-native/verified-commit.txt --repository \"$GITHUB_REPOSITORY\" --run-id \"$VERIFIED_RUN_ID\" --revision \"$(git rev-parse HEAD)\")\"\nprintf \"ATMA_VERIFIED_COMMIT=%s\\n\" \"$verified\" \u003e\u003e \"$GITHUB_ENV\""
                                           },
                                           {
                                               "name":  "Require Apple signing secrets",
                                               "env":  {
                                                           "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                           "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                           "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
                                                           "CERT_KEY_B64":  "${{ secrets.CERT_KEY_B64 }}"
                                                       },
                                               "run":  "python3 - \u003c\u003c\u0027PY\u0027\nimport os\nnames = (\"APP_STORE_CONNECT_ISSUER_ID\", \"APP_STORE_CONNECT_KEY_IDENTIFIER\", \"APP_STORE_CONNECT_PRIVATE_KEY\", \"CERT_KEY_B64\")\nmissing = [name for name in names if not os.environ.get(name)]\nif missing:\n    raise SystemExit(\"Missing GitHub secrets: \" + \", \".join(missing))\nPY"
                                           },
                                           {
                                               "name":  "Apply existing revision gate",
                                               "run":  "bash release/ci.sh gate"
                                           },
                                           {
                                               "name":  "Validate sources and generate Xcode project",
                                               "run":  "bash release/ci.sh prepare"
                                           },
                                           {
                                               "name":  "Install pinned Apple signing tools in workspace",
                                               "run":  "python3 -m venv .cache/release-tools\n.cache/release-tools/bin/python -m pip install --disable-pip-version-check codemagic-cli-tools==0.70.0\nprintf \"%s\\n\" \"$GITHUB_WORKSPACE/.cache/release-tools/bin\" \u003e\u003e \"$GITHUB_PATH\""
                                           },
                                           {
                                               "name":  "Sign, archive, export and validate IPA",
                                               "env":  {
                                                           "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                           "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                           "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
                                                           "CERT_KEY_B64":  "${{ secrets.CERT_KEY_B64 }}"
                                                       },
                                               "run":  "bash release/ci.sh archive"
                                           },
                                           {
                                               "name":  "Record the verified build number",
                                               "id":  "build_info",
                                               "run":  "set -euo pipefail\nnumber=\"$(cat out/build-number.txt)\"\n[[ \"$number\" =~ ^[1-9][0-9]*$ ]]\nprintf \u0027number=%s\\n\u0027 \"$number\" \u003e\u003e \"$GITHUB_OUTPUT\""
                                           },
                                           {
                                               "name":  "Upload validated binary to App Store Connect",
                                               "if":  "${{ inputs.upload_to_testflight }}",
                                               "env":  {
                                                           "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                           "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                           "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
                                                       },
                                               "run":  "app-store-connect publish --path \"out/ipa/ATMA.ipa\" --enable-package-validation"
                                           },
                                           {
                                               "name":  "Save signed IPA and validation logs",
                                               "if":  "${{ always() }}",
                                               "uses":  "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
                                               "with":  {
                                                            "name":  "atma-signed-${{ github.run_id }}",
                                                            "path":  "out/ipa/*.ipa\nout/*.json\nout/*.log\nout/build-number.txt",
                                                            "retention-days":  1,
                                                            "if-no-files-found":  "warn",
                                                            "overwrite":  true
                                                        }
                                           }
                                       ],
                             "needs":  "verification",
                             "outputs":  {
                                             "build_number":  "${{ steps.build_info.outputs.number }}"
                                         }
                         },
                 "distribute":  {
                                    "runs-on":  "ubuntu-latest",
                                    "timeout-minutes":  75,
                                    "steps":  [
                                                  {
                                                      "name":  "Verify processing and distribute to ATMA TestFlight groups",
                                                      "env":  {
                                                                  "APP_STORE_CONNECT_ISSUER_ID":  "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                                                                  "APP_STORE_CONNECT_KEY_IDENTIFIER":  "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
                                                                  "APP_STORE_CONNECT_PRIVATE_KEY":  "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}",
                                                                  "ATMA_BUILD_NUMBER":  "${{ needs.ios.outputs.build_number }}"
                                                              },
                                                      "run":  "node - \u003c\u003c\u0027JS\u0027\nconst {createPrivateKey,sign}=require(\u0027node:crypto\u0027);\nconst env=process.env;\nconst key=createPrivateKey(env.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,\u0027\\n\u0027));\nconst app=\u00276826668990\u0027;\nconst buildNumber=env.ATMA_BUILD_NUMBER;\nif(!/^[1-9][0-9]*$/.test(buildNumber))throw Error(\u0027Invalid expected build number\u0027);\nconst encode=value=\u003eBuffer.from(JSON.stringify(value)).toString(\u0027base64url\u0027);\nfunction token(){\n const now=Math.floor(Date.now()/1000);\n const payload=encode({alg:\u0027ES256\u0027,kid:env.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:\u0027JWT\u0027})+\u0027.\u0027+encode({iss:env.APP_STORE_CONNECT_ISSUER_ID,iat:now,exp:now+600,aud:\u0027appstoreconnect-v1\u0027});\n return payload+\u0027.\u0027+sign(\u0027sha256\u0027,Buffer.from(payload),{key,dsaEncoding:\u0027ieee-p1363\u0027}).toString(\u0027base64url\u0027);\n}\n\nconst desiredGroups = new Map([\n [\u0027c1231ead-b3b9-41f5-9729-1eb911c94c97\u0027, {name:\u0027Test\u0027, internal:true}],\n [\u0027d33d96df-5e15-4778-b996-af769afe76b2\u0027, {name:\u0027Test1\u0027, internal:false}],\n [\u0027da39915e-2642-422b-aa5d-203e5064a343\u0027, {name:\u0027толпа\u0027, internal:false}],\n]);\nconst sleep = ms =\u003e new Promise(resolve =\u003e setTimeout(resolve, ms));\nasync function request(path, method=\u0027GET\u0027, body) {\n const res = await fetch(\u0027https://api.appstoreconnect.apple.com/v1\u0027+path,{\n  method, headers:{Authorization:\u0027Bearer \u0027+token(), Accept:\u0027application/json\u0027, ...(body?{\u0027Content-Type\u0027:\u0027application/json\u0027}:{})},\n  body:body?JSON.stringify(body):undefined, signal:AbortSignal.timeout(25000), redirect:\u0027error\u0027\n });\n if(res.status===204) return null;\n const json=await res.json();\n if(!res.ok) throw Error(\u0027Apple HTTP \u0027+res.status+\u0027 \u0027+JSON.stringify((json.errors||[]).map(({code,title,detail})=\u003e({code,title,detail}))));\n return json;\n}\nasync function findBuild() {\n const query=new URLSearchParams({\u0027filter[app]\u0027:app,\u0027filter[version]\u0027:buildNumber,include:\u0027preReleaseVersion\u0027,limit:\u002750\u0027});\n for(let tries=0;tries\u003c120;tries++){\n  const response=await request(\u0027/builds?\u0027+query);\n  const candidate=response.data.find(row=\u003e{\n   const route=row.relationships.preReleaseVersion?.data?.id;\n   const version=response.included?.find(item=\u003eitem.type===\u0027preReleaseVersions\u0027\u0026\u0026item.id===route);\n   return row.attributes.version===buildNumber\u0026\u0026version?.attributes.version===\u00271.0.1\u0027\u0026\u0026version?.attributes.platform===\u0027IOS\u0027;\n  });\n  if(candidate?.attributes.expired)throw Error(\u0027ATMA build \u0027+buildNumber+\u0027 has expired\u0027);\n  if(candidate?.attributes.processingState===\u0027VALID\u0027)return candidate.id;\n  if([\u0027INVALID\u0027,\u0027FAILED\u0027].includes(candidate?.attributes.processingState))throw Error(\u0027Apple processing failed: \u0027+candidate.attributes.processingState);\n  console.log(\u0027PROCESSING \u0027+(candidate?.attributes.processingState??\u0027waiting for Apple to make the build available\u0027));\n  await sleep(35000);\n }\n throw Error(\u0027ATMA build \u0027+buildNumber+\u0027 is still pending processing at Apple\u0027);\n}\nconst notes={\n ru:\u0027Добавлены китайский (упрощённый), корейский и японский языки интерфейса. Проверьте выбор языка в настройках и его сохранение после перезапуска.\u0027,\n \u0027en-US\u0027:\u0027Added Simplified Chinese, Korean and Japanese interface languages. Check language selection in Settings and that your choice is saved after restarting.\u0027\n};\nasync function releaseNotes(build) {\n const localizations=(await request(\u0027/builds/\u0027+build+\u0027/betaBuildLocalizations?limit=50\u0027)).data;\n for(const [locale,whatsNew] of Object.entries(notes)){\n  const existing=localizations.find(row=\u003erow.attributes.locale.toLowerCase()===locale.toLowerCase());\n  if(existing?.attributes.whatsNew?.trim())continue;\n  if(existing){\n   await request(\u0027/betaBuildLocalizations/\u0027+existing.id,\u0027PATCH\u0027,{data:{type:\u0027betaBuildLocalizations\u0027, id:existing.id, attributes:{whatsNew}}});\n  }else{\n   await request(\u0027/betaBuildLocalizations\u0027,\u0027POST\u0027,{data:{type:\u0027betaBuildLocalizations\u0027, attributes:{locale,whatsNew},relationships:{build:{data:{type:\u0027builds\u0027,id:build}}}}});\n  }\n }\n}\nasync function main() {\n const build=await findBuild();\n console.log(\u0027BUILD_ID \u0027+build);\n const groups=(await request(\u0027/apps/\u0027+app+\u0027/betaGroups?limit=200\u0027)).data;\n for(const [id, expected] of desiredGroups) {\n  const actual=groups.find(group=\u003egroup.id===id)?.attributes;\n  if(actual?.name!==expected.name||actual.isInternalGroup!==expected.internal)throw Error(\u0027Missing expected TestFlight group: \u0027+expected.name);\n }\n await releaseNotes(build);\n const hasBuild=async id=\u003e{\n  const links=(await request(\u0027/betaGroups/\u0027+id+\u0027/relationships/builds?limit=200\u0027)).data;\n  return links.some(row=\u003erow.id===build);\n };\n for(const [id,group] of desiredGroups){\n  if(await hasBuild(id))continue;\n  await request(\u0027/betaGroups/\u0027+id+\u0027/relationships/builds\u0027,\u0027POST\u0027,{data:[{type:\u0027builds\u0027,id:build}]});\n  console.log(\u0027ADDED \u0027+group.name);\n }\n const confirmed=[];\n for(const [id,group] of desiredGroups){\n  if(!await hasBuild(id))throw Error(\u0027The tester group link was not confirmed: \u0027+group.name);\n  confirmed.push(group.name);\n }\n console.log(\u0027BUILD_GROUPS \u0027+JSON.stringify(confirmed));\n const details=async()=\u003e(await request(\u0027/builds/\u0027+build+\u0027/buildBetaDetail\u0027)).data.attributes;\n let state=await details();\n if(state.externalBuildState===\u0027READY_FOR_BETA_SUBMISSION\u0027){\n  await request(\u0027/betaAppReviewSubmissions\u0027,\u0027POST\u0027,{data:{type:\u0027betaAppReviewSubmissions\u0027,relationships:{build:{data:{type:\u0027builds\u0027,id:build}}}}});\n  state=await details();\n }\n console.log(\u0027BETA_DETAIL \u0027+JSON.stringify(state));\n if(state.externalBuildState===\u0027READY_FOR_BETA_TESTING\u0027){\n  await request(\u0027/buildBetaNotifications\u0027,\u0027POST\u0027,{data:{type:\u0027buildBetaNotifications\u0027,relationships:{build:{data:{type:\u0027builds\u0027,id:build}}}}});\n }\n for(let tries=0;tries\u003c9;tries++){\n  state=await details();\n  console.log(\u0027BETA_DETAIL \u0027+JSON.stringify(state));\n  if(state.externalBuildState===\u0027IN_BETA_TESTING\u0027)return;\n  if([\u0027BETA_REJECTED\u0027,\u0027EXPIRED\u0027].includes(state.externalBuildState))throw Error(\u0027External testing blocked: \u0027+state.externalBuildState);\n  await sleep(15000);\n }\n}\nmain().catch(error=\u003e{console.error(error.message);process.exitCode=1});\n\nJS"
                                                  }
                                              ],
                                    "needs":  "ios",
                                    "if":  "${{ inputs.upload_to_testflight }}"
                                }
             }
}
