{
  "name": "ATMA — activate TestFlight build 11",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "atma-distribute-build-11",
    "cancel-in-progress": false
  },
  "jobs": {
    "distribute": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Wait for Apple and distribute build 11",
          "env": {
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'JS'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst env=process.env;\nconst key=createPrivateKey(env.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst app='6826668990';\nconst encode=value=>Buffer.from(JSON.stringify(value)).toString('base64url');\nfunction token(){\n const now=Math.floor(Date.now()/1000);\n const payload=encode({alg:'ES256',kid:env.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+encode({iss:env.APP_STORE_CONNECT_ISSUER_ID,iat:now,exp:now+600,aud:'appstoreconnect-v1'});\n return payload+'.'+sign('sha256',Buffer.from(payload),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\n}\n\nconst desiredGroups = new Map([\n ['c1231ead-b3b9-41f5-9729-1eb911c94c97', {name:'Test', internal:true}],\n ['d33d96df-5e15-4778-b996-af769afe76b2', {name:'Test1', internal:false}],\n ['da39915e-2642-422b-aa5d-203e5064a343', {name:'толпа', internal:false}],\n]);\nconst sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\nasync function request(path, method='GET', body) {\n const res = await fetch('https://api.appstoreconnect.apple.com/v1'+path,{\n  method, headers:{Authorization:'Bearer '+token(), Accept:'application/json', ...(body?{'Content-Type':'application/json'}:{})},\n  body:body?JSON.stringify(body):undefined, signal:AbortSignal.timeout(25000), redirect:'error'\n });\n if(res.status===204) return null;\n const json=await res.json();\n if(!res.ok) throw Error('Apple HTTP '+res.status+' '+JSON.stringify((json.errors||[]).map(({code,title,detail})=>({code,title,detail}))));\n return json;\n}\nasync function findBuild() {\n const query=new URLSearchParams({'filter[app]':app,'filter[version]':'11',include:'preReleaseVersion',limit:'50'});\n for(let tries=0;tries<30;tries++){\n  const response=await request('/builds?'+query);\n  const candidate=response.data.find(row=>{\n   const route=row.relationships.preReleaseVersion?.data?.id;\n   const version=response.included?.find(item=>item.type==='preReleaseVersions'&&item.id===route);\n   return row.attributes.version==='11'&&version?.attributes.version==='1.0.1'&&version?.attributes.platform==='IOS';\n  });\n  if(candidate?.attributes.expired)throw Error('ATMA build 11 has expired');\n  if(candidate?.attributes.processingState==='VALID')return candidate.id;\n  if(['INVALID','FAILED'].includes(candidate?.attributes.processingState))throw Error('Apple processing failed: '+candidate.attributes.processingState);\n  console.log('PROCESSING '+(candidate?.attributes.processingState??'waiting for upload'));\n  await sleep(20000);\n }\n throw Error('ATMA build 11 is still pending processing at Apple');\n}\nconst notes={\n ru:'Проверьте перевод веб-страниц, выбор обоев и размеры элементов на экране вкладок. Проверьте значок сайта при добавлении на рабочий стол, кнопки удаления в верхнем ряду и раскрытие второго ряда быстрого доступа.',\n 'en-US':'Test page translation, wallpaper selection and tab controls. Also check the website logo when adding a shortcut, the remove buttons in the first row, and expanding the second row of Quick Access.'\n};\nasync function releaseNotes(build) {\n const localizations=(await request('/builds/'+build+'/betaBuildLocalizations?limit=50')).data;\n for(const [locale,whatsNew] of Object.entries(notes)){\n  const existing=localizations.find(row=>row.attributes.locale.toLowerCase()===locale.toLowerCase());\n  if(existing?.attributes.whatsNew?.trim())continue;\n  if(existing){\n   await request('/betaBuildLocalizations/'+existing.id,'PATCH',{data:{type:'betaBuildLocalizations', id:existing.id, attributes:{whatsNew}}});\n  }else{\n   await request('/betaBuildLocalizations','POST',{data:{type:'betaBuildLocalizations', attributes:{locale,whatsNew},relationships:{build:{data:{type:'builds',id:build}}}}});\n  }\n }\n}\nasync function main() {\n const build=await findBuild();\n console.log('BUILD_ID '+build);\n const groups=(await request('/apps/'+app+'/betaGroups?limit=200')).data;\n for(const [id, expected] of desiredGroups) {\n  const actual=groups.find(group=>group.id===id)?.attributes;\n  if(actual?.name!==expected.name||actual.isInternalGroup!==expected.internal)throw Error('Missing expected TestFlight group: '+expected.name);\n }\n await releaseNotes(build);\n const associated=async()=>(await request('/builds/'+build+'/betaGroups?limit=200')).data;\n const before=new Set((await associated()).map(row=>row.id));\n for(const [id,group] of desiredGroups){\n  if(before.has(id))continue;\n  await request('/betaGroups/'+id+'/relationships/builds','POST',{data:[{type:'builds',id:build}]});\n  console.log('ADDED '+group.name);\n }\n const after=await associated();\n if(![...desiredGroups.keys()].every(id=>after.some(group=>group.id===id)))throw Error('The tester group links were not all confirmed');\n console.log('BUILD_GROUPS '+JSON.stringify(after.map(group=>group.attributes.name)));\n const details=async()=>(await request('/builds/'+build+'/buildBetaDetail')).data.attributes;\n let state=await details();\n if(state.externalBuildState==='READY_FOR_BETA_SUBMISSION'){\n  await request('/betaAppReviewSubmissions','POST',{data:{type:'betaAppReviewSubmissions',relationships:{build:{data:{type:'builds',id:build}}}}});\n  state=await details();\n }\n console.log('BETA_DETAIL '+JSON.stringify(state));\n if(state.externalBuildState==='READY_FOR_BETA_TESTING'){\n  await request('/buildBetaNotifications','POST',{data:{type:'buildBetaNotifications',relationships:{build:{data:{type:'builds',id:build}}}}});\n }\n for(let tries=0;tries<9;tries++){\n  state=await details();\n  console.log('BETA_DETAIL '+JSON.stringify(state));\n  if(state.externalBuildState==='IN_BETA_TESTING')return;\n  if(['BETA_REJECTED','EXPIRED'].includes(state.externalBuildState))throw Error('External testing blocked: '+state.externalBuildState);\n  await sleep(15000);\n }\n}\nmain().catch(error=>{console.error(error.message);process.exitCode=1});\n\nJS"
        }
      ]
    }
  }
}
