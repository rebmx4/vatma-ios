{
  "name": "ATMA — upload signed build 11",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "atma-signing",
    "cancel-in-progress": false
  },
  "jobs": {
    "upload": {
      "runs-on": "macos-26",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Download the signed IPA",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "atma-signed-45956067125",
            "run-id": "45956067125",
            "github-token": "${{ github.token }}",
            "path": "signed"
          }
        },
        {
          "name": "Verify exact IPA and distribution signature",
          "run": "printf '%s  %s\\n' 3a1281a1ab717f3e64db37bb0706c2c34391a4ca00f202f9db907f42b856db67 signed/ipa/ATMA.ipa | shasum -a 256 -c -\nditto -x -k signed/ipa/ATMA.ipa extracted\ncodesign --verify --deep --strict extracted/Payload/ATMA.app\n/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' extracted/Payload/ATMA.app/Info.plist | grep -x 11\n/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' extracted/Payload/ATMA.app/Info.plist | grep -Fx ru.atma.browser\n/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' extracted/Payload/ATMA.app/Info.plist | grep -Fx 1.0.1"
        },
        {
          "name": "Install Apple upload CLI",
          "run": "python3 -m venv .upload-tools\n.upload-tools/bin/python -m pip install --disable-pip-version-check codemagic-cli-tools==0.70.0"
        },
        {
          "name": "Upload to App Store Connect",
          "env": {
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": ".upload-tools/bin/app-store-connect publish --path signed/ipa/ATMA.ipa --enable-package-validation"
        }
      ]
    }
  }
}
