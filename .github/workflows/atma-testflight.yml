{
  "name": "ATMA public release preparation",
  "run-name": "Prepare ATMA 1.0.1 draft with build 14",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "store": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "ATMA App Store Connect",
          "env": {
            "APP_STORE_CONNECT_KEY_IDENTIFIER": "${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "node - <<'NODE'\nconst {createPrivateKey,sign}=require('node:crypto');\nconst e=process.env;\nconst enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');\nconst h=enc({alg:'ES256',kid:e.APP_STORE_CONNECT_KEY_IDENTIFIER,typ:'JWT'})+'.'+enc({iss:e.APP_STORE_CONNECT_ISSUER_ID,iat:Math.floor(Date.now()/1000)-5,exp:Math.floor(Date.now()/1000)+600,aud:'appstoreconnect-v1'});\nconst key=createPrivateKey(e.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\\\n/g,'\\n'));\nconst jwt=h+'.'+sign('sha256',Buffer.from(h),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');\nconst app='6826668990';\nasync function req(path,method='GET',data){\n const r=await fetch('https://api.appstoreconnect.apple.com/v1'+path,{method,headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:data?JSON.stringify({data}):undefined});\n if(r.status===204)return null;\n const j=await r.json();\n if(!r.ok)throw Error(method+' '+path.split('?')[0]+' '+r.status+' '+(j.errors||[]).map(x=>[x.code,x.detail]).join(','));\n return j.data;\n}\n(async()=>{\nconst all=await req('/apps/'+app+'/appStoreVersions?limit=30');\nlet v=all.find(x=>x.attributes.versionString==='1.0.1'&&x.attributes.platform==='IOS');\nconst prev=all.find(x=>x.attributes.versionString==='1.0.0'&&x.attributes.platform==='IOS');\nif(!prev)throw Error('Missing previous iOS version');\nconst build=await req('/builds/15f23a91-8e42-42fa-b598-2b06967b42f1');\nif(build.attributes.version!=='14'||build.attributes.processingState!=='VALID'||build.attributes.expired)throw Error('Build 14 unavailable');\nconst parent=await req('/builds/'+build.id+'/preReleaseVersion');\nif(parent.attributes.version!=='1.0.1'||parent.attributes.platform!=='IOS')throw Error('Unexpected marketing version');\nif(!v)v=await req('/appStoreVersions','POST',{type:'appStoreVersions',attributes:{versionString:'1.0.1',platform:'IOS',releaseType:'AFTER_APPROVAL',copyright:prev.attributes.copyright},relationships:{app:{data:{type:'apps',id:app}},build:{data:{type:'builds',id:build.id}}}});\nif(v.attributes.appStoreState!=='PREPARE_FOR_SUBMISSION')throw Error('Draft not editable');\nconst linked=await req('/appStoreVersions/'+v.id+'/build');if(linked?.id!==build.id)throw Error('Unexpected linked build');\nconsole.log('STORE14 DRAFT '+JSON.stringify([v.id,v.attributes.appStoreState,v.attributes.releaseType,linked.attributes.version]));\nconst infos=await req('/apps/'+app+'/appInfos?limit=30'); console.log('STORE14 INFOS '+JSON.stringify(infos.map(x=>[x.id,x.attributes.appStoreState])));\nfor(const k of ['appStoreVersionLocalizations','appStoreReviewDetail']){\ntry{const x=await req('/appStoreVersions/'+v.id+'/'+k);console.log('STORE14 '+k+' '+JSON.stringify(Array.isArray(x)?x.map(t=>t.attributes.locale):Object.keys(x?.attributes||{}).map(t=>[t,!!x.attributes[t]])))}catch(e){console.log('STORE14 '+k+' '+e.message)}\n}\n})().catch(e=>{console.error(e.message);process.exitCode=1});\nNODE"
        }
      ]
    }
  }
}