workflows:
  atma-testflight:
    name: "1. ATMA browser — iPhone check (M4)"
    max_build_duration: 120
    instance_type: mac_mini_m4
    environment:
      xcode: "26.4"
      node: "24.16.0"
    scripts:
      - name: Prepare pinned native source and ATMA branding
        script: bash release/ci.sh prepare
      - name: Compile native core for iPhone simulator
        script: bash release/ci.sh core-simulator
      - name: Verify native browser on iPhone simulator
        script: bash release/ci.sh smoke
    artifacts:
      - out/*.json
      - out/*.log
      - out/verified-commit.txt
      - out/screenshots/**/*.png
      - out/ATMA-smoke.xcresult
  atma-device-testflight:
    name: "2. ATMA browser — TestFlight (after iPhone check, M4)"
    max_build_duration: 120
    instance_type: mac_mini_m4
    inputs:
      verified_commit:
        description: "Commit from verified-commit.txt in a successful iPhone check of this revision"
        type: string
    integrations:
      app_store_connect: ATMA
    environment:
      xcode: "26.4"
      node: "24.16.0"
      groups:
        - atma_browser_signing
      vars:
        ATMA_VERIFIED_COMMIT: ${{ inputs.verified_commit }}
    scripts:
      - name: Require the verified simulator revision
        script: test "${ATMA_VERIFIED_COMMIT:?A passing simulator build is required}" = "$(git rev-parse HEAD)"
      - name: Prepare pinned native source and ATMA branding
        script: bash release/ci.sh prepare
      - name: Compile native core for iPhone devices
        script: bash release/ci.sh core-device
      - name: Sign, archive and verify ATMA for TestFlight
        script: bash release/ci.sh archive
    artifacts:
      - out/ipa/*.ipa
      - out/*.json
      - out/*.log
      - out/build-number.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
