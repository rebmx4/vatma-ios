{
  "workflows": {
    "atma-testflight": {
      "name": "1. ATMA standalone - iPhone + iPad check (M2)",
      "max_build_duration": 30,
      "instance_type": "mac_mini_m2",
      "environment": {
        "xcode": "26.4"
      },
      "cache": {
        "cache_paths": [
          "$CM_BUILD_DIR/.cache/derived-simulator"
        ]
      },
      "scripts": [
        {
          "name": "Validate standalone inputs and generate Xcode project",
          "script": "bash release/ci.sh prepare"
        },
        {
          "name": "Run XCTest and real iPhone/iPad UI smoke",
          "script": "bash release/ci.sh smoke"
        }
      ],
      "artifacts": [
        "out/*.json",
        "out/*.log",
        "out/verified-commit.txt",
        "out/screenshots/**/*.png",
        "out/ATMA-*.xcresult",
        "out/*-final.png"
      ]
    },
    "atma-device-testflight": {
      "name": "2. ATMA standalone - verified TestFlight (M2)",
      "max_build_duration": 30,
      "instance_type": "mac_mini_m2",
      "inputs": {
        "verified_commit": {
          "description": "Exact verified-commit.txt from a successful iPhone + iPad check of this revision",
          "type": "string"
        }
      },
      "integrations": {
        "app_store_connect": "ATMA"
      },
      "environment": {
        "xcode": "26.4",
        "groups": [
          "atma_browser_signing"
        ],
        "vars": {
          "ATMA_VERIFIED_COMMIT": "${{ inputs.verified_commit }}"
        }
      },
      "cache": {
        "cache_paths": [
          "$CM_BUILD_DIR/.cache/derived-device"
        ]
      },
      "scripts": [
        {
          "name": "Require the exact verified revision",
          "script": "bash release/ci.sh gate"
        },
        {
          "name": "Validate standalone inputs and generate Xcode project",
          "script": "bash release/ci.sh prepare"
        },
        {
          "name": "Sign, archive, export and validate ATMA IPA",
          "script": "bash release/ci.sh archive"
        }
      ],
      "artifacts": [
        "out/ipa/*.ipa",
        "out/*.json",
        "out/*.log",
        "out/build-number.txt"
      ],
      "publishing": {
        "app_store_connect": {
          "auth": "integration",
          "submit_to_testflight": true
        }
      }
    }
  }
}
